<title>Jeopardizzy! Word-Game Show</title>
<style>

:root[data-theme="dark"]{--bg:#18211C;--surface:#222D27;--ink:#E7EEE5;--mute:#98A69C;--sage-soft:#2A3B30;--sage-d:#A9D1B4;--onsage:#17211B;--butter:#CDBE72;--butter-soft:#3A3722;--butter-d:#DCCD82;--line:#32403A;--shadow:0 6px 24px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.55}
a{color:var(--sage-d)}
header{padding:18px 24px}
header .in{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header a.brand{color:var(--ink);text-decoration:none;font-size:22px;font-weight:650;letter-spacing:-.01em}
header a.brand span{color:var(--sage-d)}
nav{display:flex;gap:4px;flex-wrap:wrap;font-size:15px}
nav a{color:var(--mute);text-decoration:none;padding:7px 15px;border-radius:999px;transition:background .15s,color .15s}
nav a:hover{background:var(--sage-soft)}

main{max-width:1100px;margin:0 auto;padding:10px 24px 60px}
h1{font-size:32px;font-weight:650;letter-spacing:-.02em;margin-bottom:6px}
h2{font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.1em;margin:34px 0 12px}
.lead{color:var(--mute);margin-bottom:14px;max-width:700px}
.hero{background:linear-gradient(135deg,var(--sage-soft),var(--butter-soft));border-radius:28px;padding:48px 34px;margin:6px 0 4px}
.hero h1{font-size:48px;letter-spacing:-.03em}
.hero h1 span{color:var(--sage-d)}
.hero p{color:var(--mute);max-width:560px;margin:10px 0 22px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);transition:transform .15s,background .15s}
.card:hover{transform:translateY(-2px);background:var(--sage-soft)}
.card b{display:block;font-size:17px;font-weight:600;margin-bottom:3px}
.card small{color:var(--mute);font-size:14px}
.jt{display:block;text-decoration:none;background:var(--butter);color:#33311B;border-radius:18px;padding:22px 12px;text-align:center;transition:transform .15s,background .15s}
.jt:hover{transform:translateY(-2px);background:var(--butter-d)}
.jt b{display:block;font-size:28px;font-weight:650;letter-spacing:-.02em}
.jt small{font-size:14px;opacity:.75}
.btn,button,.big{font-family:inherit;font-size:15px;padding:9px 18px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block;transition:background .15s}
.btn:hover,button:hover{background:var(--sage-soft)}
.btn.p,.big{background:var(--sage-d);color:var(--onsage);border-color:var(--sage-d)}
.btn.p:hover,.big:hover{background:var(--sage-d);filter:brightness(1.08)}
.big{font-size:17px;padding:13px 28px;font-weight:600}
.rounds{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.rounds button.on{background:var(--sage-d);color:var(--onsage);border-color:var(--sage-d)}
.board{display:grid;gap:10px}
.cat{background:var(--sage-soft);color:var(--sage-d);padding:12px 8px;text-align:center;font-size:15px;font-weight:600;min-height:66px;display:flex;align-items:center;justify-content:center;line-height:1.25;border-radius:14px}
.cell{background:var(--butter);color:#33311B;font-size:26px;font-weight:650;text-align:center;padding:22px 6px;cursor:pointer;user-select:none;border-radius:14px;border:1px solid transparent;transition:background .15s,transform .15s}
.cell:hover{background:var(--butter-d);transform:translateY(-1px)}
.cell:focus-visible{outline:3px solid var(--sage-d);outline-offset:2px}
.cell.done{background:transparent;border:1px dashed var(--line);color:transparent;cursor:default;transform:none}
.scores{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
.team{flex:1 1 160px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.team input{border:none;border-bottom:1px solid var(--line);font-family:inherit;font-size:15px;padding:3px 0;background:transparent;color:var(--ink)}
.team input:focus{outline:none;border-bottom-color:var(--sage-d)}
.team .score{font-size:32px;font-weight:650;color:var(--sage-d)}
.adj{display:flex;gap:6px}.adj button{padding:5px 12px}
.tools{display:flex;flex-direction:column;gap:8px;justify-content:center}
.overlay{position:fixed;inset:0;background:rgba(36,48,40,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.overlay.open{display:flex}

.meta{font-size:13px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.clue{font-size:27px;line-height:1.35;font-weight:550;margin-bottom:22px}
.answer{font-size:24px;font-weight:600;color:var(--sage-d);background:var(--sage-soft);padding:14px 18px;border-radius:14px;margin-bottom:22px;display:none}
.answer.show{display:block}
.answer small{display:block;font-size:15px;font-weight:400;color:var(--ink);margin-top:6px;line-height:1.4}
.row{display:flex;gap:8px;flex-wrap:wrap}
.award{margin-top:16px;display:none}.award.show{display:block}
.award p{color:var(--mute);margin-bottom:8px}
.gc{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin:16px 0;overflow:hidden}
.gc h3{background:var(--sage-soft);color:var(--sage-d);font-weight:600;font-size:18px;padding:12px 18px}
.gc div.b{padding:14px 18px 18px}
.gc .sk{color:var(--mute);font-size:14px;margin-bottom:6px}
.gc h4{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em;margin:14px 0 4px}
.gc .ex{background:var(--butter-soft);padding:10px 14px;border-radius:12px}
.gc ul{margin-left:20px}.gc li{margin:3px 0}
ol.tasks{margin-left:26px}ol.tasks li{margin:6px 0;font-size:17px}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 16px;margin:12px 0}
details summary{cursor:pointer;color:var(--sage-d);font-weight:600}
ol.key{margin-left:26px;margin-top:8px}ol.key li{margin:4px 0}

.btn[disabled],button[disabled]{opacity:.5;cursor:not-allowed}
.wb{max-width:720px}.tag{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 18px}.prog i{display:block;height:100%;background:var(--sage-d);transition:width .3s}
.q{font-size:26px;line-height:1.4;font-weight:550;margin:10px 0 16px;word-break:break-word}
.ans-in{width:100%;font-size:20px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font-family:inherit}

.fb{margin-top:14px;padding:12px 16px;border-radius:14px;display:none;line-height:1.5}.fb.show{display:block}.fb.ok{background:var(--sage-soft);color:var(--ink)}.fb.no{background:var(--butter-soft);color:var(--ink)}

@media (max-width:720px){header{padding:14px 12px}main{padding:6px 12px 44px}h1{font-size:26px}.hero{padding:30px 20px;border-radius:22px}.hero h1{font-size:34px}.board{gap:5px}.cat{font-size:11px;min-height:54px;padding:8px 3px;border-radius:10px}.cell{font-size:17px;padding:14px 3px;border-radius:10px}.mcard{padding:24px 20px}.clue{font-size:21px}.answer{font-size:20px}}

const GUIDES=[[{"n": "What a Pair!", "sk": "long-term memory, working memory, executive functioning", "how": "You get half of a familiar word pairing (a fixed phrase joined by 'and'). Supply the missing half. The blank can come first or second.", "ex": "<b>Clue:</b> Part and ____ &nbsp;&nbsp; <b>Answer:</b> Part and <b>parcel</b> (an essential component).", "st": ["Say the phrase aloud. These pairs are fixed in order and often sound right before you can explain why.", "Listen for alliteration or rhyme (wit/wisdom, bits/pieces, part/parcel).", "Ask what kind of pair it is: near-synonyms (rules/regulations), complements (lock/key) or an old phrase (hue and cry).", "If stuck, run through the alphabet with the first letter of the missing word."]}, {"n": "Stinky Pinky", "sk": "long-term memory, executive functioning", "how": "Each answer is two rhyming words. You decode it from an offbeat definition.", "ex": "<b>Clue:</b> A gloomy father &nbsp;&nbsp; <b>Answer:</b> <b>Sad dad</b>. (Example from the file: Mrs. Onassis's tan pants = Jackie's khakis.)", "st": ["Split the clue into an adjective and a noun, then find a synonym for each (gloomy = sad, father = dad).", "Look for the rhyme: test synonyms of one word against rhymes of the other.", "Count syllables. Both answer words usually have the same number (crab lab, phony pony).", "Wordier clues often point to longer answers (French stench, funny money)."]}, {"n": "Word Rebus", "sk": "multitasking, attention to detail, executive functioning", "how": "Each picture stands for a word or a single letter. Follow the plus and minus signs to add or remove sounds, then read the result.", "ex": "<b>Picture sum:</b> polo - O + tree &nbsp;&nbsp; <b>Answer:</b> take one O out of 'polo', add 'tree', and by sound you get <b>poultry</b>.", "st": ["Name every picture with the simplest word first, then try alternatives (hat may be 'derby', sink may be 'basin').", "Work left to right and write each step down.", "Think in sounds as well as letters: the result must sound like a real word.", "Test the final word. If it isn't a real word, re-check which picture names you chose.", "In the file: diver + city = diversity; sink - K + derby - Y + lock = cinderblock."]}, {"n": "What's the Word?", "sk": "working memory, attention to detail, executive functioning", "how": "Four partial words share the same three missing letters, which form a three-letter word. The blanks can sit at the start or the end of each word.", "ex": "<b>Clues:</b> ___NERS, AL___AC, HU___, ___SION &nbsp;&nbsp; <b>Answer:</b> <b>MAN</b> (manners, almanac, human, mansion).", "st": ["Start with the clue that has the most fixed letters and is easiest to guess.", "List candidate three-letter words (ice, car, bed, pan, lid, rob, ref, ill) and test each against all four clues.", "Remember the same letters may go before one word and after another.", "Only accept an answer that works in all four, and say each finished word to double-check."]}, {"n": "Acronym Alphabet", "sk": "long-term memory, working memory", "how": "Say what a common acronym stands for.", "ex": "<b>Clue:</b> VIN &nbsp;&nbsp; <b>Answer:</b> <b>Vehicle Identification Number</b>.", "st": ["Ask where you have seen it (car, sports page, government, dictionary, vet clinic).", "Map each letter to a likely word from that field.", "Some acronyms have more than one meaning (ERA: earned run average or Equal Rights Amendment). Give both if you know them.", "Use patterns: FLOTUS follows POTUS (President of the United States)."]}, {"n": "Homonyms", "sk": "long-term memory, attention to detail, executive functioning", "how": "You get two definitions. Find the two words that sound the same but differ in meaning and spelling, and spell each correctly. (In this file all pairs are strictly homophones.)", "ex": "<b>Clues:</b> a long cry of pain; a marine mammal &nbsp;&nbsp; <b>Answer:</b> <b>wail / whale</b>.", "st": ["Solve the easier definition first, then say it aloud and hunt for a sound-alike.", "Check the tricky spellings: silent letters (knows/nose), wh/w (whale/wail), -ai-/-a-e (pray/prey).", "Write both words and check that each matches its own definition, not the other.", "Match every definition to the correct spelling; a spelling error means a wrong answer."]}, {"n": "What's the Animal?", "sk": "long-term memory, working memory, executive functioning", "how": "Each answer is a two-word idiom or phrase containing an animal. You get the first word and supply the animal.", "ex": "<b>Clue:</b> Cash ____ &nbsp;&nbsp; <b>Answer:</b> Cash <b>cow</b> (a reliably profitable business).", "st": ["Skim animal groups in your head: farm, pets, wild, birds, insects.", "Say the phrase with each candidate and listen for one that sounds like a real expression.", "Recall the meaning: idioms are about people (eager beaver, silly goose).", "Some items accept more than one answer (dirty dog or dirty rat)."]}, {"n": "Double Trouble", "sk": "working memory, executive functioning", "how": "You get several words. Find the one word that can follow each of them to make a compound word or a two-word phrase.", "ex": "<b>Clues:</b> knuckle, moth, basket &nbsp;&nbsp; <b>Answer:</b> <b>ball</b> (knuckleball, mothball, basketball).", "st": ["Start with the most flexible word and list what can follow it (Holy: water, land, Bible ...).", "Test each candidate against the other words. Cross out fast.", "Don't lock onto one meaning of a word; it may be part of a phrase (cover girl, golden girl).", "Answers can be closed, open or hyphenated compounds.", "Use the first-letter hint only as a last resort."]}, {"n": "Change a Letter", "sk": "long-term memory, attention to detail, multitasking, executive functioning", "how": "Replace exactly one letter in each of three words, using the same new letter every time, without rearranging the remaining letters. The letter can be in a different position in each word.", "ex": "<b>Clues:</b> PLAY, SNAIL, WAIST &nbsp;&nbsp; <b>Answer:</b> <b>R</b>: pray, snarl, wrist.", "st": ["Pick the shortest word and try replacement letters one at a time (there are only 26).", "For each candidate letter, check the other two words right away.", "Vowel-to-consonant swaps are common, and the same letter may replace a vowel in one word and a consonant in another.", "More than one answer can work; any valid solution counts."]}, {"n": "FINE Words", "sk": "long-term memory, attention to detail, executive functioning", "how": "Every word is missing the letters F, I, N and E, in any order. Fill the blanks to reveal a common English word.", "ex": "<b>Clue:</b> K _ _ _ _ &nbsp;&nbsp; <b>Answer:</b> <b>knife</b> (the blanks hold N, I, F, E).", "st": ["Use the given letters as anchors and count the blanks: there are always four.", "Check that the four blanks use F, I, N and E exactly once each.", "Look for common endings and beginnings (-ify, -ive, -teen, con-).", "Remember the word may already contain F, I, N or E (fifteen)."]}, {"n": "Down to the Wire", "sk": "long-term memory, working memory, processing speed", "how": "Complete each expression. For a better mental workout, try all the questions in one minute.", "ex": "<b>Clue:</b> ____ to the ground &nbsp;&nbsp; <b>Answer:</b> <b>Ear</b> to the ground (stay alert to news).", "st": ["Read all items first, then answer the easiest ones.", "Move on if you're stuck for more than a few seconds; come back at the end.", "Run through likely categories: body parts, verbs, song titles.", "Other correct answers may exist, so trust the first phrase that sounds natural."]}, {"n": "Endings & Beginnings", "sk": "working memory, multitasking", "how": "You get the first half of one compound word or phrase and the second half of another. Find the single word that completes both.", "ex": "<b>Clue:</b> April ____ Proof &nbsp;&nbsp; <b>Answer:</b> <b>Fool</b> (April fool, foolproof).", "st": ["Try the more restrictive half first (____ proof: fool, water, bullet ...).", "Test each candidate against the other half.", "Say both compounds aloud, e.g. double-cross and crossword.", "Use the first-letter hint only if you're truly stuck."]}, {"n": "Opposites Attract", "sk": "multitasking, executive functioning", "how": "Rearrange the letters of each word to reveal a pair of opposites.", "ex": "<b>Clue:</b> ARF / EARN &nbsp;&nbsp; <b>Answer:</b> <b>far / near</b>.", "st": ["Think of common opposite pairs first (near/far, left/right, north/south, inside/outside).", "Check the letter counts for each candidate before you commit.", "Solve the easier half: once you know 'far', 'near' follows.", "Look for letter clusters (TH, SH, -IDE, -ER) and write the letters in a circle."]}], [{"n": "Need Directions?", "sk": "long-term memory, working memory", "how": "You get the name of a famous street, intersection or highway, real or fictional. Say which city, country, region or story it belongs to.", "ex": "<b>Clue:</b> The Grand Canal &nbsp;&nbsp; <b>Answer:</b> <b>Venice, Italy</b>.", "st": ["Look for clues in the name itself: canal (water city), Bowery or Beltway (American), Road (British or fictional).", "Think of songs, films and books: Abbey Road (the Beatles), the Yellow Brick Road (The Wizard of Oz).", "Sort what you know into groups (capitals, port cities, fiction) and place the street in one.", "Give the most specific answer you can, e.g. the city and its country."]}, {"n": "Say What?", "sk": "long-term memory, executive functioning", "how": "A sentence has been rewritten in stiff, overly formal words. Translate it back into the well-known saying.", "ex": "<b>Clue:</b> 'Humans who reside in clear, vitreous residences ought not to hurl small rocks.' &nbsp;&nbsp; <b>Answer:</b> <b>People who live in glass houses should not throw stones.</b>", "st": ["Replace the fancy words with plain ones one by one (vitreous = glass, residences = houses).", "Look at the sentence's shape and rhythm; proverbs are short and often rhyme or repeat sounds.", "Ask what general lesson the sentence teaches, then recall a saying with that message.", "Check that the words you swapped back match the clue word for word."]}, {"n": "Finish the Proverb", "sk": "long-term memory, executive functioning", "how": "You get just the last words of a well-known saying. Fill in the rest.", "ex": "<b>Clue:</b> ____ are free. &nbsp;&nbsp; <b>Answer:</b> <b>The best things in life are free.</b>", "st": ["Think about the message that the ending suggests (free things: love, friendship, nature).", "Try likely openings aloud (The best, All the best, The greatest).", "Remember proverbs are in fixed wording, so aim for the classic version.", "If you cannot recall it, say the ending with a tune or rhythm; wording often follows."]}, {"n": "Odd Man Out", "sk": "long-term memory, working memory, executive functioning", "how": "In each list, all but one item share a link. Find the one that does not belong and say why.", "ex": "<b>Items:</b> Chocolate, Casino, Potato, Guitar &nbsp;&nbsp; <b>Answer:</b> <b>Guitar</b>. The rest are types of chips.", "st": ["Look for a word that can go before or after each item (Golden ____, ____ chip, Old ____).", "Try the same word with all four; the one that does not fit is the odd one out.", "Consider different meanings of each word, not just the first one that comes to mind.", "Say the link out loud, because the explanation counts as much as the item."]}, {"n": "Happy Endings", "sk": "working memory, multitasking, attention to detail", "how": "Four incomplete words share the same missing letters at their ends. Find the letters that complete all four.", "ex": "<b>Clues:</b> CA___, SWE___, OBSE___, CONSE___ &nbsp;&nbsp; <b>Answer:</b> <b>RVE</b> (carve, swerve, observe, conserve).", "st": ["Start with the shortest stem and list what could end it.", "Test each ending on the other three words at once.", "Common endings to try: -able, -tive, -cal, -oon.", "The number of blanks tells you how many letters to add; count them."]}, {"n": "Nicknames", "sk": "long-term memory, executive functioning", "how": "Name the person, place or thing from its nickname.", "ex": "<b>Clue:</b> Old Glory &nbsp;&nbsp; <b>Answer:</b> <b>The American flag</b>.", "st": ["Ask what the nickname describes (a look, a shape, a habit).", "Decide the category first: person, place, object.", "Break the nickname into parts: 'Soup Strainer' hints at something worn on the face.", "Some nicknames have more than one answer (The Tube = London Underground or TV)."]}, {"n": "BigBoy", "sk": "long-term memory, working memory", "how": "Each answer is a word, name, phrase or saying containing BIG.", "ex": "<b>Clue:</b> A group of seven stars in Ursa Major &nbsp;&nbsp; <b>Answer:</b> <b>The Big Dipper</b>.", "st": ["Use the clue's field (science, business, history) to pick from BIG phrases you know: Big Bang, Big Blue, Big Stick.", "Fill in the blank: 'The Big ___', 'Big ___', 'Bigger ___ to fry'.", "The answer may be a whole saying, so think about proverbs and famous quotations.", "Say the phrase aloud to confirm it works."]}, {"n": "OTHER Words and FORE Words", "sk": "long-term memory, attention to detail, executive functioning", "how": "Every word is missing the letters O, T, H, E, R (or F, O, R, E), in any order. Restore them to reveal a common word. The same idea appears in earlier guides as FINE Words.", "ex": "<b>Clue:</b> _ A _ _ _ W _ RM &nbsp;&nbsp; <b>Answer:</b> <b>earthworm</b>.", "st": ["Count the blanks; they must hold exactly the given letters, once each.", "Use the fixed letters as anchors and guess common word shapes (-ster, -ing, -ent).", "Letters can repeat: a printed letter may match one you must add (OFFER has two F's, one printed).", "Say the word aloud; the sound often reveals it faster than the spelling."]}], [{"n": "Addables", "sk": "long-term memory, multitasking, attention to detail", "how": "You get a word and a success scale in brackets. In two minutes, add one letter to the word and rearrange all the letters to make as many new words as you can. The first number is a good score; the second is how many common words exist.", "ex": "<b>Clue:</b> RUG (4 out of 8) &nbsp;&nbsp; <b>Answers:</b> burg, drug, frug, grub, guru, rugs, rung, urge.", "st": ["Try each letter of the alphabet in turn (A, B, C ...) and rearrange; this is the most reliable method.", "Add common endings first: -S, -ED, -ER, -Y (busts, busty).", "Watch for letter clusters: for BUST, try B-U-T plus a letter (butts, bouts).", "Do not worry about the exact list; other correct words also count."]}, {"n": "Saintly Surprises", "sk": "long-term memory, working memory", "how": "Each answer is a person, place or thing with a saint's name hidden in it. Find the saint.", "ex": "<b>Clue:</b> A brand of aspirin &nbsp;&nbsp; <b>Answer:</b> <b>St. Joseph</b>.", "st": ["Think of names that start with St. (hospitals, cities, brands, herbs).", "Use the clue's category: medicine (St. Joseph, St. Jude), travel (The Spirit of St. Louis), TV (St. Elsewhere).", "Say the name with possible saints aloud; one will ring a bell.", "Some answers are plain-sounding: St. John's wort is a herb."]}, {"n": "Jingles & Slogans", "sk": "long-term memory, executive functioning", "how": "Finish the advertising jingle or slogan, and, where needed, name the product.", "ex": "<b>Clue:</b> 'Maybe she's born with it, ____.' &nbsp;&nbsp; <b>Answer:</b> <b>maybe it's Maybelline.</b>", "st": ["Hum the tune. Jingles are built to be remembered by rhythm and melody.", "Think about the type of product (cosmetics, paper towels, beer) and recall brands that used it.", "Finish the rhyme if there is one (time / beer).", "Name the product or company to complete the answer."]}, {"n": "Double Trouble: Animal Edition", "sk": "working memory, executive functioning", "how": "As in Double Trouble: find the one word that can follow each given word. Here, every answer is an animal. (The general strategy is in the first guide.)", "ex": "<b>Clues:</b> Book, Silk, Tape &nbsp;&nbsp; <b>Answer:</b> <b>worm</b> (bookworm, silkworm, tapeworm).", "st": ["Run through animal groups (birds, farm, wild, insects) and test each against the clues.", "Say the phrases: eat crow, cry wolf, talk turkey, spring chicken.", "Watch idiom meanings; 'Jim Crow' and 'cold turkey' are fixed phrases.", "Use the first-letter hint only when stuck."]}], [{"n": "Mathematically Speaking", "sk": "long-term memory, working memory", "how": "The clues seem unrelated to maths, but every answer is a mathematical term.", "ex": "<b>Clue:</b> A unit of ice &nbsp;&nbsp; <b>Answer:</b> <b>cube</b>.", "st": ["Think of maths vocabulary: shapes (square, circle, cube, triangle), operations, units.", "Test each shape or term against the clue's everyday meaning.", "Look for the double meaning: a 'square' is a shape and an unhip person; 'proof' is both a maths term and an alcohol measure.", "Ask what the word does in ordinary life (a pilot 'circles')."]}, {"n": "Geographical Nicknames", "sk": "long-term memory, executive functioning", "how": "Name each city from its nickname.", "ex": "<b>Clue:</b> Second City &nbsp;&nbsp; <b>Answer:</b> <b>Chicago</b>.", "st": ["Ask what the nickname points to: a product (Big Peach), a history (Witch City), a rank (Second City).", "Match the food or symbol to a place known for it.", "Think of landmarks: the Forbidden City is in Beijing.", "Give the state too if you know it (Salem, Massachusetts)."]}, {"n": "Number Words", "sk": "multitasking, attention to detail, executive functioning", "how": "Insert a numeral in the blank to complete a word, by the sound of the number.", "ex": "<b>Clue:</b> Lieu___ant &nbsp;&nbsp; <b>Answer:</b> <b>Lieu10ant</b> (lieutenant).", "st": ["Say the clue with each number from 1 to 10 in the blank (Sk + eight = skate).", "Listen for the sound: 4 = for/fore, 2 = too/to, 8 = ate, 6 = six.", "Some blanks work with more than one number (Be4 = before; Be9 = benign).", "Check that the joined word is spelled correctly."]}, {"n": "Scrambled States", "sk": "working memory, executive functioning", "how": "Each odd phrase is an anagram of a U.S. state. Unscramble the letters.", "ex": "<b>Clue:</b> AAA LAMB &nbsp;&nbsp; <b>Answer:</b> <b>Alabama</b>.", "st": ["Count the letters and compare with state names of the same length.", "Look for letter patterns: -ING, -ARY, -IA, -OTA (Michigan, Maryland).", "Try the longest, most distinctive letters first (W, Z, H).", "Work through the list of 50 states alphabetically if stuck."]}, {"n": "Ted's Terrible Titles", "sk": "long-term memory, executive functioning", "how": "A title of a book, play, song or film has been reworded. Restore the original.", "ex": "<b>Clue:</b> Hubris and Bias &nbsp;&nbsp; <b>Answer:</b> <b>Pride and Prejudice</b>.", "st": ["Swap each word for a synonym (hubris = pride, bias = prejudice).", "Keep the rhythm; titles are short and often in a fixed pattern (___ and ___).", "Think of the genre: a novel, a play, a film.", "Name the author if you know it; it confirms your answer."]}], [{"n": "Colorfill", "sk": "long-term memory, working memory", "how": "Put the missing colour back into each phrase, title or name.", "ex": "<b>Clue:</b> Agent ____ &nbsp;&nbsp; <b>Answer:</b> <b>Orange</b>.", "st": ["Run through the basic colours and test each one aloud.", "Think of films, songs and famous names (Yellow Submarine, Pink Panther).", "Some blanks accept more than one colour (Pink Panther or Black Panther).", "Use the rest of the phrase for context: parachute, panther, submarine."]}, {"n": "Who's Asking?", "sk": "long-term memory, working memory, executive functioning", "how": "You get a famous question. Name the person or group who asked it.", "ex": "<b>Clue:</b> 'Is that all there is?' &nbsp;&nbsp; <b>Answer:</b> <b>Peggy Lee</b>.", "st": ["Ask where the question was said: a song, a hearing, an interview, a film.", "Think of the era and the people who were famous then.", "A rhetorical tone ('Have you no sense of decency?') points to a dramatic public moment.", "Say the line aloud; a melody or an old news clip may come to mind."]}, {"n": "Whose Biography?", "sk": "long-term memory, executive functioning", "how": "From the title of a biography, memoir or autobiography, and the years of the subject's life, name the person.", "ex": "<b>Clue:</b> A Moveable Feast (1899-1961) &nbsp;&nbsp; <b>Answer:</b> <b>Ernest Hemingway</b>.", "st": ["Use the dates first: which famous person lived 1899 to 1961?", "Think of the subject's field: writer, chef, statesman, revolutionary.", "Match the title's theme to the person's life (a journey, a kitchen, a long walk).", "Recall where you have seen the book (library, bestseller list, school reading)."]}, {"n": "Filled with Emotion", "sk": "long-term memory, working memory", "how": "Each phrase is missing an emotion word. Put it back.", "ex": "<b>Clue:</b> Green with ____ &nbsp;&nbsp; <b>Answer:</b> <b>envy</b>.", "st": ["List feelings (envy, pity, joy, regret, fear) and test each in the blank.", "Say the whole phrase; fixed expressions sound right immediately.", "Think of clubs, names and titles too (Glee Club).", "Sometimes the word is a noun, not an adjective (remorse, surprise)."]}], [{"n": "Letter-Pattern Definition Games", "sk": "long-term memory, working memory", "how": "It's Playtime, Big Bang, It's Charming, Just J's, Patchwork, Brrrr!, Golly Gee and Echo Echo. Every answer follows a hidden pattern: it contains a word (play, time), starts with certain letters (CH, J, PAT, BR), starts with the initials B B or G G, or repeats a sound (boo boo, yo-yo).", "ex": "<b>Clue (Just J's):</b> A carpenter's tool or a kind of puzzle &nbsp;&nbsp; <b>Answer:</b> <b>Jigsaw</b>.", "st": ["Read the rule at the top first; it shrinks the answer list dramatically.", "Say the clue's meaning in one word, then check it against the pattern.", "Use the letters as a search tool: run through words that start with CH, BR or PAT.", "For initials (B B, G G), think of famous names and phrases first.", "For Echo Echo, think of doubled words: hush-hush, bye-bye, tutu."]}, {"n": "Federal Holidays (30-Second Madness)", "sk": "long-term memory, working memory, processing speed", "how": "Name as many of the ten official U.S. federal holidays as you can in thirty seconds.", "ex": "<b>Prompt:</b> Federal holiday in July &nbsp;&nbsp; <b>Answer:</b> <b>Independence Day</b>.", "st": ["Go through the calendar month by month.", "Group them: winter (New Year's Day, MLK Day, Presidents Day), summer (Memorial, Independence, Labor), autumn (Columbus, Veterans, Thanksgiving) and Christmas.", "Use mnemonics: holidays tied to people, to wars, or to work.", "Write each as you recall it; do not repeat one."]}, {"n": "Letter Speller", "sk": "long-term memory, working memory", "how": "Each answer sounds like a single letter (sea = C, eye = I). Give the letter.", "ex": "<b>Clue:</b> The plural of 'is' &nbsp;&nbsp; <b>Answer:</b> <b>R</b> (are).", "st": ["First find the word the clue describes, then say it aloud.", "Match the sound to the alphabet: bee, sea, tea, pea, you, why.", "Think of homophones (ewe = U, owe = O).", "Check that the word and letter sound exactly alike."]}, {"n": "Rhyme Time and Rhyming Words and Phrases", "sk": "long-term memory, working memory", "how": "Rhyme Time gives two definitions whose answers rhyme. Rhyming Words and Phrases has one definition whose answer is a two-word or two-syllable rhyme (hocus pocus).", "ex": "<b>Clues:</b> Humorous; and cash &nbsp;&nbsp; <b>Answer:</b> <b>funny; money</b>.", "st": ["Solve the easier definition first, then search for rhymes of that word.", "Run through the alphabet (b, c, d, f ...) in front of the ending sound.", "For two-word rhymes, think of common phrases: prime time, fender bender, brain drain.", "Check that both definitions fit their words."]}, {"n": "Alma's Shopping List", "sk": "working memory, executive function, processing speed", "how": "Each grocery item is misspelled by one letter. Fix the letter to reveal a real brand or food name. For extra challenge, try to get as many as possible in one minute.", "ex": "<b>Clue:</b> Winded &nbsp;&nbsp; <b>Answer:</b> <b>Windex</b> (D changes to X).", "st": ["Say the misspelled word aloud; it often sounds like the real one.", "Change one letter at a time, working from the vowels.", "Think of brands: Snickers, Pampers, Skippy, Jell-O.", "Some items have more than one answer (corn or pork)."]}, {"n": "Who the What?", "sk": "long-term memory, working memory", "how": "You get the name and 'the'; supply the word that follows (Felix the Cat).", "ex": "<b>Clue:</b> Alexander the ____ &nbsp;&nbsp; <b>Answer:</b> <b>Great</b>.", "st": ["Think of cartoons, history, nicknames and nursery characters.", "Say the full phrase aloud.", "The word is often a job (Sailor, Pirate) or trait (Great, Terrible).", "Use your general memory of famous nicknames."]}, {"n": "Word Parts", "sk": "long-term memory, working memory, executive functioning", "how": "You get definitions for the two parts of a word. Put them together (men + ace = menace).", "ex": "<b>Clues:</b> Chum + highest card &nbsp;&nbsp; <b>Answer:</b> <b>pal + ace = palace</b>.", "st": ["Solve each part separately and write it down.", "Join the parts in order; try both orders if needed.", "Watch for opposites (opposite of on = off).", "Check that the joined word is real."]}, {"n": "Replace the Swamp / Chartreuse Titles", "sk": "long-term memory, executive functioning", "how": "A famous title contains a placeholder (SWAMP or CHARTREUSE). Replace it with the correct geographic feature or color.", "ex": "<b>Clue:</b> Treasure SWAMP &nbsp;&nbsp; <b>Answer:</b> <b>Treasure Island</b>.", "st": ["Say the title with a likely geographic word (island, lake, river) or color (pink, red).", "Think of the author or film the title belongs to.", "Check the rhythm: titles are fixed in wording.", "Some answers have alternatives (Blue Christmas)."]}, {"n": "What's the Missing Number?", "sk": "long-term memory, executive functioning", "how": "Fill in the number from a title, saying or fact.", "ex": "<b>Clue:</b> ____ deadly sins &nbsp;&nbsp; <b>Answer:</b> <b>7</b>.", "st": ["Recall the whole phrase, then the number.", "Use categories: films (12 Angry Men), history (13 colonies), religion (10 Commandments).", "Sing it if it is a song: 99 bottles of beer.", "Check unusual numbers by counting (50 states)."]}, {"n": "What Do They Have in Common?", "sk": "long-term memory, executive functioning, attention to detail", "how": "A list of items shares something. Find the link.", "ex": "<b>Clue:</b> Jig, Twist, Tango &nbsp;&nbsp; <b>Answer:</b> <b>They are all dances</b>.", "st": ["Think of different meanings for each word (tail, pocket, crown, pin).", "Try categories: pets, dolls, fish, cars, slang for money.", "Test your link on every item.", "Names often point to people (Olivers, First Ladies' maiden names)."]}, {"n": "Finish the Food Idiom / Don't Be an Idiom", "sk": "long-term memory, executive functioning", "how": "Complete the idiom with a food (Finish the Food Idiom) or finish a sentence with an idiom starting with 'on' (Don't Be an Idiom).", "ex": "<b>Clue:</b> Spill the ____ &nbsp;&nbsp; <b>Answer:</b> <b>beans</b>.", "st": ["Say the idiom aloud; the food usually pops up.", "Read the situation carefully: 'on the wagon' means not drinking.", "Check the meaning, not just the sound.", "Some idioms accept more than one answer (on the blink or on the fritz)."]}, {"n": "Anagrams", "sk": "executive functioning", "how": "Rearrange the letters of the word to make the stated number of other words.", "ex": "<b>Clue:</b> Evil (3) &nbsp;&nbsp; <b>Answers:</b> live, veil, vile.", "st": ["Try starting with different first letters.", "Look for common endings (-s, -ed, -er) and clusters (ST, TH).", "Write the letters in a circle.", "Count the words you find against the number given."]}, {"n": "What a Pair (Redefine)", "sk": "long-term memory, working memory, executive functioning", "how": "Each clue redefines the two halves of a familiar pair. Work out the pair.", "ex": "<b>Clue:</b> Wonder and Perrier &nbsp;&nbsp; <b>Answer:</b> <b>Bread and Water</b>.", "st": ["Identify what each half is (steak or chicken = meat).", "Say the likely pair: Meat and Potatoes.", "Think of famous pairings: Fish and Chips, Bed and Breakfast.", "Check that both clues fit."]}, {"n": "Palindromes", "sk": "long-term memory, working memory, executive functioning", "how": "Each answer is a word that reads the same backward and forward.", "ex": "<b>Clue:</b> Adam's gal &nbsp;&nbsp; <b>Answer:</b> <b>Eve</b>.", "st": ["Think of short words with symmetrical letters (bib, pup, nun, dud).", "Test by writing the word backward.", "Common palindromes: madam, kayak, level, radar.", "Clues often describe a simple object or name."]}]];

 const it=ses.p[ses.i],t=it.t;let hinted=false,answered=false;
 app.innerHTML=`<div class="wb"><div class="tag">Task ${ses.i+1} of ${ses.p.length} \u00B7 ${t.name} \u00B7 ${LVN[it.lv]}</div><div class="prog"><i style="width:${ses.i/ses.p.length*100}%"></i></div>
 <p class="lead" style="margin-bottom:4px">${t.instr}</p><div class="q">${it.q}</div>
 <input class="ans-in" id="in" placeholder="${t.ph}" autocomplete="off" autocapitalize="off" spellcheck="false">
 <div class="row" style="margin-top:12px"><button class="btn p" id="chk">Check</button><button class="btn" id="hint">Hint</button><button class="btn" id="show">Show answer</button></div>
 <div class="fb" id="fb"></div><div class="row" style="margin-top:14px"><button class="btn p" id="next" style="display:none">${ses.i+1<ses.p.length?'Next task':'See results'}</button></div></div>`;
 const fb=$('fb'),inp=$('in');inp.focus();
 const end=ok=>{if(answered)return;answered=true;ses.res.push({it,ok});if(ok)ses.ok++;inp.disabled=true;$('chk').style.display=$('hint').style.display=$('show').style.display='none';$('next').style.display='';
  fb.className='fb show '+(ok?'ok':'no');fb.innerHTML=`<b>${ok?'Correct!':'Not quite.'}</b> Answer: <b>${ansText(it)}</b><div style="margin-top:6px">${it.exp}</div>`;$('next').focus()};
 $('chk').onclick=()=>{if(!inp.value.trim()){inp.focus();return}if(isOk(it,inp.value))end(true);else{fb.className='fb show no';fb.innerHTML='Not quite. Try again, use a hint, or show the answer.';inp.select()}};
 $('hint').onclick=()=>{fb.className='fb show no';fb.textContent=hintOf(it);hinted=true};
 $('show').onclick=()=>end(false);
 inp.onkeydown=e=>{if(e.key==='Enter'){if(answered)$('next').click();else $('chk').click()}};
 $('next').onclick=()=>{ses.i++;ses.i<ses.p.length?task():results()}}
function results(){
 const n=ses.p.length,by={};ses.res.forEach(r=>{const k=r.it.t.name;by[k]=by[k]||[0,0];by[k][1]++;if(r.ok)by[k][0]++});
 const miss=ses.res.filter(r=>!r.ok);
 app.innerHTML=`<div class="wb"><h1>Well done!</h1><div class="score">${ses.ok} / ${n}</div>
 <p class="lead">${ses.ok===n?'A perfect score!':ses.ok>=n*0.7?'Great work. Try a harder level next.':'Good effort. Keep practising and check the guides for strategies.'}</p>
 <ul style="margin:0 0 16px 20px">${Object.entries(by).map(([k,v])=>`<li>${k}: ${v[0]} / ${v[1]}</li>`).join('')}</ul>
 ${miss.length?`<h2>Review the ones you missed</h2><ul style="margin-left:20px">${miss.map(r=>`<li style="margin:6px 0">${r.it.q}<br><b>${ansText(r.it)}</b></li>`).join('')}</ul>`:''}
 <div class="row" style="margin-top:18px"><button class="btn p" id="again">Practise again</button><button class="btn" id="chg">Change settings</button><a class="btn" href="#/guide/1">Read the guides</a></div></div>`;
 $('again').onclick=()=>{let p=shuffle(pool()).slice(0,wb.n);if(wb.level==='Mixed')p.sort((a,b)=>a.lv-b.lv);ses={p,i:0,ok:0,res:[]};task()};
 $('chg').onclick=setup}

function route(){ov.classList.remove('open');const h=(location.hash||'#/').split('/');window.scrollTo(0,0);
 try{if(h[1]==='play'&&SETS[+h[2]-1])play(+h[2]);else if(h[1]==='guide'&&GUIDES[+h[2]-1])guide(+h[2]);else if(h[1]==='sets')sets();else if(h[1]==='workbook')workbook();else home()}catch(e){home()}}
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
