<title>Jeopardizzy! Word-Game Show</title>
<style>

:root[data-theme="dark"]{--bg:#18211C;--surface:#222D27;--ink:#E7EEE5;--mute:#98A69C;--sage-soft:#2A3B30;--sage-d:#A9D1B4;--onsage:#17211B;--butter:#CDBE72;--butter-soft:#3A3722;--butter-d:#DCCD82;--line:#32403A;--shadow:0 6px 24px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.55}
a{color:var(--sage-d)}
header{padding:18px 24px}
header .in{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header a.brand{color:var(--ink);text-decoration:none;font-size:22px;font-weight:650;letter-spacing:-.01em}
header a.brand span{color:var(--sage-d)}
nav{display:flex;gap:4px;flex-wrap:wrap;font-size:15px}
nav a{color:var(--mute);text-decoration:none;padding:7px 15px;border-radius:999px;transition:background .15s,color .15s}
nav a:hover{background:var(--sage-soft)}

main{max-width:1100px;margin:0 auto;padding:10px 24px 60px}
h1{font-size:32px;font-weight:650;letter-spacing:-.02em;margin-bottom:6px}
h2{font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.1em;margin:34px 0 12px}
.lead{color:var(--mute);margin-bottom:14px;max-width:700px}
.hero{background:linear-gradient(135deg,var(--sage-soft),var(--butter-soft));border-radius:28px;padding:48px 34px;margin:6px 0 4px}
.hero h1{font-size:48px;letter-spacing:-.03em}
.hero h1 span{color:var(--sage-d)}
.hero p{color:var(--mute);max-width:560px;margin:10px 0 22px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);transition:transform .15s,background .15s}
.card:hover{transform:translateY(-2px);background:var(--sage-soft)}
.card b{display:block;font-size:17px;font-weight:600;margin-bottom:3px}
.card small{color:var(--mute);font-size:14px}
.jt{display:block;text-decoration:none;background:var(--butter);color:#33311B;border-radius:18px;padding:22px 12px;text-align:center;transition:transform .15s,background .15s}
.jt:hover{transform:translateY(-2px);background:var(--butter-d)}
.jt b{display:block;font-size:28px;font-weight:650;letter-spacing:-.02em}
.jt small{font-size:14px;opacity:.75}
.btn,button,.big{font-family:inherit;font-size:15px;padding:9px 18px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block;transition:background .15s}
.btn:hover,button:hover{background:var(--sage-soft)}
.btn.p,.big{background:var(--sage-d);color:var(--onsage);border-color:var(--sage-d)}
.btn.p:hover,.big:hover{background:var(--sage-d);filter:brightness(1.08)}
.big{font-size:17px;padding:13px 28px;font-weight:600}
.rounds{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.rounds button.on{background:var(--sage-d);color:var(--onsage);border-color:var(--sage-d)}
.board{display:grid;gap:10px}
.cat{background:var(--sage-soft);color:var(--sage-d);padding:12px 8px;text-align:center;font-size:15px;font-weight:600;min-height:66px;display:flex;align-items:center;justify-content:center;line-height:1.25;border-radius:14px}
.cell{background:var(--butter);color:#33311B;font-size:26px;font-weight:650;text-align:center;padding:22px 6px;cursor:pointer;user-select:none;border-radius:14px;border:1px solid transparent;transition:background .15s,transform .15s}
.cell:hover{background:var(--butter-d);transform:translateY(-1px)}
.cell:focus-visible{outline:3px solid var(--sage-d);outline-offset:2px}
.cell.done{background:transparent;border:1px dashed var(--line);color:transparent;cursor:default;transform:none}
.scores{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
.team{flex:1 1 160px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.team input{border:none;border-bottom:1px solid var(--line);font-family:inherit;font-size:15px;padding:3px 0;background:transparent;color:var(--ink)}
.team input:focus{outline:none;border-bottom-color:var(--sage-d)}
.team .score{font-size:32px;font-weight:650;color:var(--sage-d)}
.adj{display:flex;gap:6px}.adj button{padding:5px 12px}
.tools{display:flex;flex-direction:column;gap:8px;justify-content:center}
.overlay{position:fixed;inset:0;background:rgba(36,48,40,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.overlay.open{display:flex}

.meta{font-size:13px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.clue{font-size:27px;line-height:1.35;font-weight:550;margin-bottom:22px}
.answer{font-size:24px;font-weight:600;color:var(--sage-d);background:var(--sage-soft);padding:14px 18px;border-radius:14px;margin-bottom:22px;display:none}
.answer.show{display:block}
.answer small{display:block;font-size:15px;font-weight:400;color:var(--ink);margin-top:6px;line-height:1.4}
.row{display:flex;gap:8px;flex-wrap:wrap}
.award{margin-top:16px;display:none}.award.show{display:block}
.award p{color:var(--mute);margin-bottom:8px}
.gc{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin:16px 0;overflow:hidden}
.gc h3{background:var(--sage-soft);color:var(--sage-d);font-weight:600;font-size:18px;padding:12px 18px}
.gc div.b{padding:14px 18px 18px}
.gc .sk{color:var(--mute);font-size:14px;margin-bottom:6px}
.gc h4{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em;margin:14px 0 4px}
.gc .ex{background:var(--butter-soft);padding:10px 14px;border-radius:12px}
.gc ul{margin-left:20px}.gc li{margin:3px 0}
ol.tasks{margin-left:26px}ol.tasks li{margin:6px 0;font-size:17px}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 16px;margin:12px 0}
details summary{cursor:pointer;color:var(--sage-d);font-weight:600}
ol.key{margin-left:26px;margin-top:8px}ol.key li{margin:4px 0}

.btn[disabled],button[disabled]{opacity:.5;cursor:not-allowed}
.wb{max-width:720px}.tag{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 18px}.prog i{display:block;height:100%;background:var(--sage-d);transition:width .3s}
.q{font-size:26px;line-height:1.4;font-weight:550;margin:10px 0 16px;word-break:break-word}
.ans-in{width:100%;font-size:20px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font-family:inherit}

.fb{margin-top:14px;padding:12px 16px;border-radius:14px;display:none;line-height:1.5}.fb.show{display:block}.fb.ok{background:var(--sage-soft);color:var(--ink)}.fb.no{background:var(--butter-soft);color:var(--ink)}

@media (max-width:720px){header{padding:14px 12px}main{padding:6px 12px 44px}h1{font-size:26px}.hero{padding:30px 20px;border-radius:22px}.hero h1{font-size:34px}.board{gap:5px}.cat{font-size:11px;min-height:54px;padding:8px 3px;border-radius:10px}.cell{font-size:17px;padding:14px 3px;border-radius:10px}.mcard{padding:24px 20px}.clue{font-size:21px}.answer{font-size:20px}}

hat starts a football game."]]}, {"name": "Homonyms A I", "items": [["Consumed; or, seven plus one. [give both words]", "Ate / eight", "Homonyms: ate = consumed; eight = seven plus one. Homonyms sound the same but have different spellings or meanings."], ["A fragrance; or, a penny. [give both words]", "Scent / cent", "Homonyms: scent = a fragrance; cent = a penny. "], ["A blossom; or, a basic baking ingredient. [give both words]", "Flower / flour", "Homonyms: flower = a blossom; flour = a basic baking ingredient. "], ["Plant seeds; or, to use a needle and thread. [give both words]", "Sow / sew", "Homonyms: sow = plant seeds; sew = to use a needle and thread. Sow: to plant seeds. Sew: to stitch with needle and thread."], ["The top of a mountain; or, a quick, furtive glance. [give both words]", "Peak / peek", "Homonyms: peak = the top of a mountain; peek = a quick, furtive glance. Peak: the top of a mountain. Peek: a quick, sly look."]]}, {"name": "Homonyms A II", "items": [["A mortgage or cash advance; or, solitary. [give both words]", "Loan / lone", "Homonyms: loan = a mortgage or cash advance; lone = solitary. Loan: borrowed money. Lone: solitary."], ["A part in a play or movie; or, dinner bread. [give both words]", "Role / roll", "Homonyms: role = a part in a play or movie; roll = dinner bread. Role: a part in a play or movie. Roll: a bun."], ["Having a husky or weak voice; or, a stallion or mustang. [give both words]", "Hoarse / horse", "Homonyms: hoarse = having a husky or weak voice; horse = a stallion or mustang. Hoarse: with a rough, weak voice. Horse: the animal."], ["Temporary stop in action or speech; or, an animal’s feet. [give both words]", "Pause / paws", "Homonyms: pause = temporary stop in action or speech; paws = an animal’s feet. Pause: a brief stop. Paws: animal feet."], ["Spooky, creepy; or, one of the Great Lakes. [give both words]", "Eerie / Erie", "Homonyms: eerie = spooky, creepy; erie = one of the Great Lakes. Eerie: spooky. Lake Erie: one of ]]}, {"name": "Bonus Mix 5", "items": [["(Rhymin’ Geography) Name the two rhyming places: A major tourist center and leading resort on the French Riviera; and, the nation that gave birth to democracy and the Olympics. [two rhyming places]", "Nice and Greece", "Nice: French Riviera resort. Greece: birthplace of democracy and the Olympics."], ["(Finish the Saying) Give credit where ____ [3 words]", "Give credit where credit is due.", "Saying: praise people for what they have earned."], ["(Finish the Saying) Honesty is ____ [3 words]", "Honesty is the best policy.", "Proverb: telling the truth works out best in the long run."], ["(Finish the Saying) Money is ____ [5 words]", "Money is the root of all evil.", "Saying (misquoted from the Bible, “the love of money”): greed causes harm."], ["(Finish the Saying) All is fair ____ [4 words]", "All is fair in love and war.", "Saying: in love and war, any tactic is acceptable."]]}, {"name": "Bonus Mix 6", "items": [["(Mark My Words) Someone who suffers persecution and death for refusing to renounce a belief, usually religious. [starts with MAR]", "Martyr", "Martyr: someone who suffers or dies for their beliefs."], ["(Mark My Words) The sign above the entrance to a movie theater. [starts with MAR]", "Marquee", "Marquee: the lighted sign over a theater entrance."], ["(Mark My Words) Unlike its cousin the swordfish, this large marine fish with a spear-like snout is rarely eaten. Most sport fishermen unhook and release them. [starts with MAR]", "Marlin", "Marlin: a large game fish with a spear-like snout, related to swordfish."], ["(M & M’s) The phrase used to describe Superman’s alter ego Clark Kent. [initials M. M.]", "Mild-Mannered", "Mild-mannered: gentle and polite, like reporter Clark Kent."], ["(M & M’s) The highest mountain peak in North America, it’s better known in Alaska as Denali. [initials M. M.]", "Mt. McKinley", "Mt. McKinley (Denali): the highest peak in North America, in Alaska."]]}, {"name": "Bonus Mix 7", "items": [["(Geographical Double Entendres) A county in southern California or . . . a citrus fruit. [a place that is also a word]", "Orange", "Orange County: southern California; orange: a citrus fruit."], ["(Double Trouble) ____ + quake, shaking, worm [starts with E]", "Earth", "Earthquake, earthshaking, earthworm."], ["(Double Trouble) ____ + maker, stick, box, book [starts with M]", "Match", "Matchmaker, matchstick, matchbox, matchbook. Matchmaker: someone who arranges romances."], ["(Double Trouble) ____ + study, wear, privileged [starts with U]", "Under", "Understudy, underwear, underprivileged. Understudy: an actor who learns a part in case the lead is absent."], ["(Double Trouble) ____ + cushion, stripe, wheel, point, ball [starts with P]", "Pin", "Pincushion, pinstripe, pinwheel, pinpoint, pinball."]]}, {"name": "Bonus Mix 8", "items": [["(Add It Up) Add the number of hours in a day to the number of points scored in a grand slam home run.", "28", "Working: 24 + 4 = 28."], ["(Add It Up) Add the street address of the White House to the number of goals in a “hat trick” in hockey.", "1603", "Working: 1600 + 3 = 1603."], ["(Add It Up) Add the Spanish numbers cinco plus cinco plus ocho and give the answer in English.", "18", "Working: 5 (cinco) + 5 (cinco) + 8 (ocho) = 18."], ["(Hidden Anatomy) _ _ _ _ _ ial — America before independence from Britain.", "Colonial", "Hidden word: COLON in [COLON]ial."], ["(Hidden Anatomy) _ _ _ _ ny — Thin.", "Skinny", "Hidden word: SKIN in [SKIN]ny."]]}, {"name": "Bonus Mix 9", "items": [["(Hidden Anatomy) _ _ _ _ age — A length of film.", "Footage", "Hidden word: FOOT in [FOOT]age."], ["(Semordnilaps) Forward it’s the movement of the ocean; backward it means to correct or improve written material.", "Tide / Edit", "Tide spelled backward is edit. Tide: ocean movement. Edit: to correct written work."], ["(Semordnilaps) Forward it’s an auger or chisel; backward it means to steal things during a riot or war.", "Tool / Loot", "Tool spelled backward is loot. Tool: auger or chisel. Loot: to steal during a riot or war."], ["(Semordnilaps) Forward it means intelligent; backward it’s another word for trolleys.", "Smart / Trams", "Smart spelled backward is trams. Smart: intelligent. Trams: trolley cars."], ["(Semordnilaps) Forward it’s a civil wrongdoing; backward it’s a medium-slow gait for a horse.", "Tort / Trot", "Tort spelled backward is trot. Tort: a civil wrong that you can be sued for. Trot: a medium-slow horse gait."]]}, {"name": "Bonus Mix 10", "items": [["(Sheesh) A small, round pungent root, mostly used in salads. [contains SH at the start or end]", "Radish", "Radish: a small, peppery round root eaten in salads."], ["(Sheesh) A word that’s often used to describe a nervous or shy cat. [contains SH at the start or end]", "Skittish", "Skittish: nervous and easily startled."], ["(Sheesh) The national plant (and emblem) of Ireland. [contains SH at the start or end]", "Shamrock", "Shamrock: three-leaf clover, Ireland’s emblem."], ["(Sheesh) A computer . . . or a crisp fall fruit. [contains SH at the start or end]", "Macintosh", "Macintosh: Apple’s computer, and a crisp fall apple."], ["(Replace the Elbow) Replace ELBOW: “Tom ELBOW” by The Brothers Grimm", "“Tom THUMB”", "Tom Thumb: a tiny hero of a Grimm fairy tale."]]}, {"name": "Bonus Mix 11", "items": [["(Replace the Elbow) Replace ELBOW: “The Telltale ELBOW” by Edgar Allan Poe", "“The Telltale HEART”", "The Tell-Tale Heart: Poe’s story of a murderer haunted by a heartbeat."], ["(Replace the Elbow) Replace ELBOW: The Three ELBOWS of Eve (Movie)", "The Three FACES of Eve", "The Three Faces of Eve: a film about a woman with three personalities."], ["(What a Pair) Smoked pork shoulder . . . and mozzarella.", "Ham and Cheese", "Ham and cheese: a sandwich; ham is cured pork shoulder."], ["(What a Pair) Torso or carcass . . . and the spiritual part of a human.", "Body and Soul", "Body and soul: wholly, with all one’s being."], ["(What a Pair) Court proceeding . . . and a mistake or miscalculation.", "Trial and Error", "Trial and error: learning by testing and fixing mistakes."]]}, {"name": "Bonus Mix 12", "items": [["(What a Pair) Fine goose feathers . . . and three strikes.", "Down and Out", "Down and out: penniless; also knocked out in boxing. Down: soft goose feathers; three strikes and you’re out."], ["(What Do They Have in Common?) What do these have in common? A hurricane, a needle, and a potato", "They all have eyes.", "Hurricane eye, needle eye, potato eyes."], ["(What Do They Have in Common?) What do these have in common? Kidney, Orson, garbanzo, and jelly", "They are all beans.", "Kidney, Orson Bean (actor), garbanzo (chickpea) and jelly beans."], ["(What Do They Have in Common?) What do these have in common? Corn, cane, beet, and maple", "They are all types of sugar.", "Corn sugar, cane sugar, beet sugar, maple sugar."], ["(Red, White, or Blue) A common backyard North American bird, it is often noisy and aggressive. [contains red, white or blue]", "Blue jay", "Blue jay: a loud, aggressive backyard bird."]]}, {"name": "Bonus Mix 13", "items": [["(Red, White, or Blue) A person of noble birth. [contains red, white or blue]", "Blue blood", "Blue blood: aristocrat; noble birth."], ["(Red, White, or Blue) A deliberate concealment of a person’s mistakes or faults to make him look better or to clear his name. [contains red, white or blue]", "Whitewash", "Whitewash: to cover up faults or mistakes (also a cheap paint)."], ["(Red, White, or Blue) A despicable storybook character who killed his first seven wives. [contains red, white or blue]", "Bluebeard", "Bluebeard: a folktale nobleman who murdered his wives."], ["(Homonyms B) A long slender rod; or, a survey of opinions or votes. [give both words]", "Pole / poll", "Homonyms: pole = a long slender rod; poll = a survey of opinions or votes. Pole: a long rod. Poll: a survey of opinions or votes."], ["(Homonyms B) True or correct as a fact; or, to pen a letter. [give both words]", "Right / write", "Homonyms: right = true or correct as a fact; write = to pen a letter. Right: correct. Write: to put on paper."]]}, {"name": "Bonus Mix 14", "items": [["(Homonyms B) To select something from a group of alternatives; or, masticates. [give both words]", "Choose / chews", "Homonyms: choose = to select something from a group of alternatives; chews = masticates. Choose: to select. Chews: bites and grinds food."], ["(Homonyms B) Greater in altitude; or, to employ someone. [give both words]", "Higher / hire", "Homonyms: higher = greater in altitude; hire = to employ someone. Higher: greater in height. Hire: to employ."], ["(Endings & Beginnings B) Sheep ____ head [starts with S]", "Skin", "Sheepskin; skinhead."], ["(Endings & Beginnings B) Play ____ hog [starts with G]", "Ground", "Playground; groundhog. Groundhog: a burrowing rodent, also known as a woodchuck."], ["(Endings & Beginnings B) Side ____ stand [starts with K]", "Kick", "Sidekick; kickstand. Sidekick: a close companion. Kickstand: a bicycle prop."]]}, {"name": "Final Clue", "items": [null, null, null, null, ["(Endings & Beginnings B) Flash ____ bulb [starts with L]", "Light", "Flashlight; lightbulb."]]}], "rounds": [[0, 5], [5, 10], [10, 15], [15, 20], [20, 25], [25, 30], [30, 35], [35, 40], [40, 45], [45, 50], [50, 55], [55, 60], [60, 65], [65, 70]], "leftFrom": 11}];
const GUIDES=[[{"n": "What a Pair!", "sk": "long-term memory, working memory, executive functioning", "how": "You get half of a familiar word pairing (a fixed phrase joined by 'and'). Supply the missing half. The blank can come first or second.", "ex": "<b>Clue:</b> Part and ____ &nbsp;&nbsp; <b>Answer:</b> Part and <b>parcel</b> (an essential component).", "st": ["Say the phrase aloud. These pairs are fixed in order and often sound right before you can explain why.", "Listen for alliteration or rhyme (wit/wisdom, bits/pieces, part/parcel).", "Ask what kind of pair it is: near-synonyms (rules/regulations), complements (lock/key) or an old phrase (hue and cry).", "If stuck, run through the alphabet with the first letter of the missing word."]}, {"n": "Stinky Pinky", "sk": "long-term memory, executive functioning", "how": "Each answer is two rhyming words. You decode it from an offbeat definition.", "ex": "<b>Clue:</b> A gloomy father &nbsp;&nbsp; <b>Answer:</b> <b>Sad dad</b>. (Example from the file: Mrs. Onassis's tan pants = Jackie's khakis.)", "st": ["Split the clue into an adjective and a noun, then find a synonym for each (gloomy = sad, father = dad).", "Look for the rhyme: test synonyms of one word against rhymes of the other.", "Count syllables. Both answer words usually have the same number (crab lab, phony pony).", "Wordier clues often point to longer answers (French stench, funny money)."]}, {"n": "Word Rebus", "sk": "multitasking, attention to detail, executive functioning", "how": "Each picture stands for a word or a single letter. Follow the plus and minus signs to add or remove sounds, then read the result.", "ex": "<b>Picture sum:</b> polo - O + tree &nbsp;&nbsp; <b>Answer:</b> take one O out of 'polo', add 'tree', and by sound you get <b>poultry</b>.", "st": ["Name every picture with the simplest word first, then try alternatives (hat may be 'derby', sink may be 'basin').", "Work left to right and write each step down.", "Think in sounds as well as letters: the result must sound like a real word.", "Test the final word. If it isn't a real word, re-check which picture names you chose.", "In the file: diver + city = diversity; sink - K + derby - Y + lock = cinderblock."]}, {"n": "What's the Word?", "sk": "working memory, attention to detail, executive functioning", "how": "Four partial words share the same three missing letters, which form a three-letter word. The blanks can sit at the start or the end of each word.", "ex": "<b>Clues:</b> ___NERS, AL___AC, HU___, ___SION &nbsp;&nbsp; <b>Answer:</b> <b>MAN</b> (manners, almanac, human, mansion).", "st": ["Start with the clue that has the most fixed letters and is easiest to guess.", "List candidate three-letter words (ice, car, bed, pan, lid, rob, ref, ill) and test each against all four clues.", "Remember the same letters may go before one word and after another.", "Only accept an answer that works in all four, and say each finished word to double-check."]}, {"n": "Acronym Alphabet", "sk": "long-term memory, working memory", "how": "Say what a common acronym stands for.", "ex": "<b>Clue:</b> VIN &nbsp;&nbsp; <b>Answer:</b> <b>Vehicle Identification Number</b>.", "st": ["Ask where you have seen it (car, sports page, government, dictionary, vet clinic).", "Map each letter to a likely word from that field.", "Some acronyms have more than one meaning (ERA: earned run average or Equal Rights Amendment). Give both if you know them.", "Use patterns: FLOTUS follows POTUS (President of the United States)."]}, {"n": "Homonyms", "sk": "long-term memory, attention to detail, executive functioning", "how": "You get two definitions. Find the two words that sound the same but differ in meaning and spelling, and spell each correctly. (In this file all pairs are strictly homophones.)", "ex": "<b>Clues:</b> a long cry of pain; a marine mammal &nbsp;&nbsp; <b>Answer:</b> <b>wail / whale</b>.", "st": ["Solve the easier definition first, then say it aloud and hunt for a sound-alike.", "Check the tricky spellings: silent letters (knows/nose), wh/w (whale/wail), -ai-/-a-e (pray/prey).", "Write both words and check that each matches its own definition, not the other.", "Match every definition to the correct spelling; a spelling error means a wrong answer."]}, {"n": "What's the Animal?", "sk": "long-term memory, working memory, executive functioning", "how": "Each answer is a two-word idiom or phrase containing an animal. You get the first word and supply the animal.", "ex": "<b>Clue:</b> Cash ____ &nbsp;&nbsp; <b>Answer:</b> Cash <b>cow</b> (a reliably profitable business).", "st": ["Skim animal groups in your head: farm, pets, wild, birds, insects.", "Say the phrase with each candidate and listen for one that sounds like a real expression.", "Recall the meaning: idioms are about people (eager beaver, silly goose).", "Some items accept more than one answer (dirty dog or dirty rat)."]}, {"n": "Double Trouble", "sk": "working memory, executive functioning", "how": "You get several words. Find the one word that can follow each of them to make a compound word or a two-word phrase.", "ex": "<b>Clues:</b> knuckle, moth, basket &nbsp;&nbsp; <b>Answer:</b> <b>ball</b> (knuckleball, mothball, basketball).", "st": ["Start with the most flexible word and list what can follow it (Holy: water, land, Bible ...).", "Test each candidate against the other words. Cross out fast.", "Don't lock onto one meaning of a word; it may be part of a phrase (cover girl, golden girl).", "Answers can be closed, open or hyphenated compounds.", "Use the first-letter hint only as a last resort."]}, {"n": "Change a Letter", "sk": "long-term memory, attention to detail, multitasking, executive functioning", "how": "Replace exactly one letter in each of three words, using the same new letter every time, without rearranging the remaining letters. The letter can be in a different position in each word.", "ex": "<b>Clues:</b> PLAY, SNAIL, WAIST &nbsp;&nbsp; <b>Answer:</b> <b>R</b>: pray, snarl, wrist.", "st": ["Pick the shortest word and try replacement letters one at a time (there are only 26).", "For each candidate letter, check the other two words right away.", "Vowel-to-consonant swaps are common, and the same letter may replace a vowel in one word and a consonant in another.", "More than one answer can work; any valid solution counts."]}, {"n": "FINE Words", "sk": "long-term memory, attention to detail, executive functioning", "how": "Every word is missing the letters F, I, N and E, in any order. Fill the blanks to reveal a common English word.", "ex": "<b>Clue:</b> K _ _ _ _ &nbsp;&nbsp; <b>Answer:</b> <b>knife</b> (the blanks hold N, I, F, E).", "st": ["Use the given letters as anchors and count the blanks: there are always four.", "Check that the four blanks use F, I, N and E exactly once each.", "Look for common endings and beginnings (-ify, -ive, -teen, con-).", "Remember the word may already contain F, I, N or E (fifteen)."]}, {"n": "Down to the Wire", "sk": "long-term memory, working memory, processing speed", "how": "Complete each expression. For a better mental workout, try all the questions in one minute.", "ex": "<b>Clue:</b> ____ to the ground &nbsp;&nbsp; <b>Answer:</b> <b>Ear</b> to the ground (stay alert to news).", "st": ["Read all items first, then answer the easiest ones.", "Move on if you're stuck for more than a few seconds; come back at the end.", "Run through likely categories: body parts, verbs, song titles.", "Other correct answers may exist, so trust the first phrase that sounds natural."]}, {"n": "Endings & Beginnings", "sk": "working memory, multitasking", "how": "You get the first half of one compound word or phrase and the second half of another. Find the single word that completes both.", "ex": "<b>Clue:</b> April ____ Proof &nbsp;&nbsp; <b>Answer:</b> <b>Fool</b> (April fool, foolproof).", "st": ["Try the more restrictive half first (____ proof: fool, water, bullet ...).", "Test each candidate against the other half.", "Say both compounds aloud, e.g. double-cross and crossword.", "Use the first-letter hint only if you're truly stuck."]}, {"n": "Opposites Attract", "sk": "multitasking, executive functioning", "how": "Rearrange the letters of each word to reveal a pair of opposites.", "ex": "<b>Clue:</b> ARF / EARN &nbsp;&nbsp; <b>Answer:</b> <b>far / near</b>.", "st": ["Think of common opposite pairs first (near/far, left/right, north/south, inside/outside).", "Check the letter counts for each candidate before you commit.", "Solve the easier half: once you know 'far', 'near' follows.", "Look for letter clusters (TH, SH, -IDE, -ER) and write the letters in a circle."]}], [{"n": "Need Directions?", "sk": "long-term memory, working memory", "how": "You get the name of a famous street, intersection or highway, real or fictional. Say which city, country, region or story it belongs to.", "ex": "<b>Clue:</b> The Grand Canal &nbsp;&nbsp; <b>Answer:</b> <b>Venice, Italy</b>.", "st": ["Look for clues in the name itself: canal (water city), Bowery or Beltway (American), Road (British or fictional).", "Think of songs, films and books: Abbey Road (the Beatles), the Yellow Brick Road (The Wizard of Oz).", "Sort what you know into groups (capitals, port cities, fiction) and place the street in one.", "Give the most specific answer you can, e.g. the city and its country."]}, {"n": "Say What?", "sk": "long-term memory, executive functioning", "how": "A sentence has been rewritten in stiff, overly formal words. Translate it back into the well-known saying.", "ex": "<b>Clue:</b> 'Humans who reside in clear, vitreous residences ought not to hurl small rocks.' &nbsp;&nbsp; <b>Answer:</b> <b>People who live in glass houses should not throw stones.</b>", "st": ["Replace the fancy words with plain ones one by one (vitreous = glass, residences = houses).", "Look at the sentence's shape and rhythm; proverbs are short and often rhyme or repeat sounds.", "Ask what general lesson the sentence teaches, then recall a saying with that message.", "Check that the words you swapped back match the clue word for word."]}, {"n": "Finish the Proverb", "sk": "long-term memory, executive functioning", "how": "You get just the last words of a well-known saying. Fill in the rest.", "ex": "<b>Clue:</b> ____ are free. &nbsp;&nbsp; <b>Answer:</b> <b>The best things in life are free.</b>", "st": ["Think about the message that the ending suggests (free things: love, friendship, nature).", "Try likely openings aloud (The best, All the best, The greatest).", "Remember proverbs are in fixed wording, so aim for the classic version.", "If you cannot recall it, say the ending with a tune or rhythm; wording often follows."]}, {"n": "Odd Man Out", "sk": "long-term memory, working memory, executive functioning", "how": "In each list, all but one item share a link. Find the one that does not belong and say why.", "ex": "<b>Items:</b> Chocolate, Casino, Potato, Guitar &nbsp;&nbsp; <b>Answer:</b> <b>Guitar</b>. The rest are types of chips.", "st": ["Look for a word that can go before or after each item (Golden ____, ____ chip, Old ____).", "Try the same word with all four; the one that does not fit is the odd one out.", "Consider different meanings of each word, not just the first one that comes to mind.", "Say the link out loud, because the explanation counts as much as the item."]}, {"n": "Happy Endings", "sk": "working memory, multitasking, attention to detail", "how": "Four incomplete words share the same missing letters at their ends. Find the letters that complete all four.", "ex": "<b>Clues:</b> CA___, SWE___, OBSE___, CONSE___ &nbsp;&nbsp; <b>Answer:</b> <b>RVE</b> (carve, swerve, observe, conserve).", "st": ["Start with the shortest stem and list what could end it.", "Test each ending on the other three words at once.", "Common endings to try: -able, -tive, -cal, -oon.", "The number of blanks tells you how many letters to add; count them."]}, {"n": "Nicknames", "sk": "long-term memory, executive functioning", "how": "Name the person, place or thing from its nickname.", "ex": "<b>Clue:</b> Old Glory &nbsp;&nbsp; <b>Answer:</b> <b>The American flag</b>.", "st": ["Ask what the nickname describes (a look, a shape, a habit).", "Decide the category first: person, place, object.", "Break the nickname into parts: 'Soup Strainer' hints at something worn on the face.", "Some nicknames have more than one answer (The Tube = London Underground or TV)."]}, {"n": "BigBoy", "sk": "long-term memory, working memory", "how": "Each answer is a word, name, phrase or saying containing BIG.", "ex": "<b>Clue:</b> A group of seven stars in Ursa Major &nbsp;&nbsp; <b>Answer:</b> <b>The Big Dipper</b>.", "st": ["Use the clue's field (science, business, history) to pick from BIG phrases you know: Big Bang, Big Blue, Big Stick.", "Fill in the blank: 'The Big ___', 'Big ___', 'Bigger ___ to fry'.", "The answer may be a whole saying, so think about proverbs and famous quotations.", "Say the phrase aloud to confirm it works."]}, {"n": "OTHER Words and FORE Words", "sk": "long-term memory, attention to detail, executive functioning", "how": "Every word is missing the letters O, T, H, E, R (or F, O, R, E), in any order. Restore them to reveal a common word. The same idea appears in earlier guides as FINE Words.", "ex": "<b>Clue:</b> _ A _ _ _ W _ RM &nbsp;&nbsp; <b>Answer:</b> <b>earthworm</b>.", "st": ["Count the blanks; they must hold exactly the given letters, once each.", "Use the fixed letters as anchors and guess common word shapes (-ster, -ing, -ent).", "Letters can repeat: a printed letter may match one you must add (OFFER has two F's, one printed).", "Say the word aloud; the sound often reveals it faster than the spelling."]}], [{"n": "Addables", "sk": "long-term memory, multitasking, attention to detail", "how": "You get a word and a success scale in brackets. In two minutes, add one letter to the word and rearrange all the letters to make as many new words as you can. The first number is a good score; the second is how many common words exist.", "ex": "<b>Clue:</b> RUG (4 out of 8) &nbsp;&nbsp; <b>Answers:</b> burg, drug, frug, grub, guru, rugs, rung, urge.", "st": ["Try each letter of the alphabet in turn (A, B, C ...) and rearrange; this is the most reliable method.", "Add common endings first: -S, -ED, -ER, -Y (busts, busty).", "Watch for letter clusters: for BUST, try B-U-T plus a letter (butts, bouts).", "Do not worry about the exact list; other correct words also count."]}, {"n": "Saintly Surprises", "sk": "long-term memory, working memory", "how": "Each answer is a person, place or thing with a saint's name hidden in it. Find the saint.", "ex": "<b>Clue:</b> A brand of aspirin &nbsp;&nbsp; <b>Answer:</b> <b>St. Joseph</b>.", "st": ["Think of names that start with St. (hospitals, cities, brands, herbs).", "Use the clue's category: medicine (St. Joseph, St. Jude), travel (The Spirit of St. Louis), TV (St. Elsewhere).", "Say the name with possible saints aloud; one will ring a bell.", "Some answers are plain-sounding: St. John's wort is a herb."]}, {"n": "Jingles & Slogans", "sk": "long-term memory, executive functioning", "how": "Finish the advertising jingle or slogan, and, where needed, name the product.", "ex": "<b>Clue:</b> 'Maybe she's born with it, ____.' &nbsp;&nbsp; <b>Answer:</b> <b>maybe it's Maybelline.</b>", "st": ["Hum the tune. Jingles are built to be remembered by rhythm and melody.", "Think about the type of product (cosmetics, paper towels, beer) and recall brands that used it.", "Finish the rhyme if there is one (time / beer).", "Name the product or company to complete the answer."]}, {"n": "Double Trouble: Animal Edition", "sk": "working memory, executive functioning", "how": "As in Double Trouble: find the one word that can follow each given word. Here, every answer is an animal. (The general strategy is in the first guide.)", "ex": "<b>Clues:</b> Book, Silk, Tape &nbsp;&nbsp; <b>Answer:</b> <b>worm</b> (bookworm, silkworm, tapeworm).", "st": ["Run through animal groups (birds, farm, wild, insects) and test each against the clues.", "Say the phrases: eat crow, cry wolf, talk turkey, spring chicken.", "Watch idiom meanings; 'Jim Crow' and 'cold turkey' are fixed phrases.", "Use the first-letter hint only when stuck."]}], [{"n": "Mathematically Speaking", "sk": "long-term memory, working memory", "how": "The clues seem unrelated to maths, but every answer is a mathematical term.", "ex": "<b>Clue:</b> A unit of ice &nbsp;&nbsp; <b>Answer:</b> <b>cube</b>.", "st": ["Think of maths vocabulary: shapes (square, circle, cube, triangle), operations, units.", "Test each shape or term against the clue's everyday meaning.", "Look for the double meaning: a 'square' is a shape and an unhip person; 'proof' is both a maths term and an alcohol measure.", "Ask what the word does in ordinary life (a pilot 'circles')."]}, {"n": "Geographical Nicknames", "sk": "long-term memory, executive functioning", "how": "Name each city from its nickname.", "ex": "<b>Clue:</b> Second City &nbsp;&nbsp; <b>Answer:</b> <b>Chicago</b>.", "st": ["Ask what the nickname points to: a product (Big Peach), a history (Witch City), a rank (Second City).", "Match the food or symbol to a place known for it.", "Think of landmarks: the Forbidden City is in Beijing.", "Give the state too if you know it (Salem, Massachusetts)."]}, {"n": "Number Words", "sk": "multitasking, attention to detail, executive functioning", "how": "Insert a numeral in the blank to complete a word, by the sound of the number.", "ex": "<b>Clue:</b> Lieu___ant &nbsp;&nbsp; <b>Answer:</b> <b>Lieu10ant</b> (lieutenant).", "st": ["Say the clue with each number from 1 to 10 in the blank (Sk + eight = skate).", "Listen for the sound: 4 = for/fore, 2 = too/to, 8 = ate, 6 = six.", "Some blanks work with more than one number (Be4 = before; Be9 = benign).", "Check that the joined word is spelled correctly."]}, {"n": "Scrambled States", "sk": "working memory, executive functioning", "how": "Each odd phrase is an anagram of a U.S. state. Unscramble the letters.", "ex": "<b>Clue:</b> AAA LAMB &nbsp;&nbsp; <b>Answer:</b> <b>Alabama</b>.", "st": ["Count the letters and compare with state names of the same length.", "Look for letter patterns: -ING, -ARY, -IA, -OTA (Michigan, Maryland).", "Try the longest, most distinctive letters first (W, Z, H).", "Work through the list of 50 states alphabetically if stuck."]}, {"n": "Ted's Terrible Titles", "sk": "long-term memory, executive functioning", "how": "A title of a book, play, song or film has been reworded. Restore the original.", "ex": "<b>Clue:</b> Hubris and Bias &nbsp;&nbsp; <b>Answer:</b> <b>Pride and Prejudice</b>.", "st": ["Swap each word for a synonym (hubris = pride, bias = prejudice).", "Keep the rhythm; titles are short and often in a fixed pattern (___ and ___).", "Think of the genre: a novel, a play, a film.", "Name the author if you know it; it confirms your answer."]}], [{"n": "Colorfill", "sk": "long-term memory, working memory", "how": "Put the missing colour back into each phrase, title or name.", "ex": "<b>Clue:</b> Agent ____ &nbsp;&nbsp; <b>Answer:</b> <b>Orange</b>.", "st": ["Run through the basic colours and test each one aloud.", "Think of films, songs and famous names (Yellow Submarine, Pink Panther).", "Some blanks accept more than one colour (Pink Panther or Black Panther).", "Use the rest of the phrase for context: parachute, panther, submarine."]}, {"n": "Who's Asking?", "sk": "long-term memory, working memory, executive functioning", "how": "You get a famous question. Name the person or group who asked it.", "ex": "<b>Clue:</b> 'Is that all there is?' &nbsp;&nbsp; <b>Answer:</b> <b>Peggy Lee</b>.", "st": ["Ask where the question was said: a song, a hearing, an interview, a film.", "Think of the era and the people who were famous then.", "A rhetorical tone ('Have you no sense of decency?') points to a dramatic public moment.", "Say the line aloud; a melody or an old news clip may come to mind."]}, {"n": "Whose Biography?", "sk": "long-term memory, executive functioning", "how": "From the title of a biography, memoir or autobiography, and the years of the subject's life, name the person.", "ex": "<b>Clue:</b> A Moveable Feast (1899-1961) &nbsp;&nbsp; <b>Answer:</b> <b>Ernest Hemingway</b>.", "st": ["Use the dates first: which famous person lived 1899 to 1961?", "Think of the subject's field: writer, chef, statesman, revolutionary.", "Match the title's theme to the person's life (a journey, a kitchen, a long walk).", "Recall where you have seen the book (library, bestseller list, school reading)."]}, {"n": "Filled with Emotion", "sk": "long-term memory, working memory", "how": "Each phrase is missing an emotion word. Put it back.", "ex": "<b>Clue:</b> Green with ____ &nbsp;&nbsp; <b>Answer:</b> <b>envy</b>.", "st": ["List feelings (envy, pity, joy, regret, fear) and test each in the blank.", "Say the whole phrase; fixed expressions sound right immediately.", "Think of clubs, names and titles too (Glee Club).", "Sometimes the word is a noun, not an adjective (remorse, surprise)."]}], [{"n": "Letter-Pattern Definition Games", "sk": "long-term memory, working memory", "how": "It's Playtime, Big Bang, It's Charming, Just J's, Patchwork, Brrrr!, Golly Gee and Echo Echo. Every answer follows a hidden pattern: it contains a word (play, time), starts with certain letters (CH, J, PAT, BR), starts with the initials B B or G G, or repeats a sound (boo boo, yo-yo).", "ex": "<b>Clue (Just J's):</b> A carpenter's tool or a kind of puzzle &nbsp;&nbsp; <b>Answer:</b> <b>Jigsaw</b>.", "st": ["Read the rule at the top first; it shrinks the answer list dramatically.", "Say the clue's meaning in one word, then check it against the pattern.", "Use the letters as a search tool: run through words that start with CH, BR or PAT.", "For initials (B B, G G), think of famous names and phrases first.", "For Echo Echo, think of doubled words: hush-hush, bye-bye, tutu."]}, {"n": "Federal Holidays (30-Second Madness)", "sk": "long-term memory, working memory, processing speed", "how": "Name as many of the ten official U.S. federal holidays as you can in thirty seconds.", "ex": "<b>Prompt:</b> Federal holiday in July &nbsp;&nbsp; <b>Answer:</b> <b>Independence Day</b>.", "st": ["Go through the calendar month by month.", "Group them: winter (New Year's Day, MLK Day, Presidents Day), summer (Memorial, Independence, Labor), autumn (Columbus, Veterans, Thanksgiving) and Christmas.", "Use mnemonics: holidays tied to people, to wars, or to work.", "Write each as you recall it; do not repeat one."]}, {"n": "Letter Speller", "sk": "long-term memory, working memory", "how": "Each answer sounds like a single letter (sea = C, eye = I). Give the letter.", "ex": "<b>Clue:</b> The plural of 'is' &nbsp;&nbsp; <b>Answer:</b> <b>R</b> (are).", "st": ["First find the word the clue describes, then say it aloud.", "Match the sound to the alphabet: bee, sea, tea, pea, you, why.", "Think of homophones (ewe = U, owe = O).", "Check that the word and letter sound exactly alike."]}, {"n": "Rhyme Time and Rhyming Words and Phrases", "sk": "long-term memory, working memory", "how": "Rhyme Time gives two definitions whose answers rhyme. Rhyming Words and Phrases has one definition whose answer is a two-word or two-syllable rhyme (hocus pocus).", "ex": "<b>Clues:</b> Humorous; and cash &nbsp;&nbsp; <b>Answer:</b> <b>funny; money</b>.", "st": ["Solve the easier definition first, then search for rhymes of that word.", "Run through the alphabet (b, c, d, f ...) in front of the ending sound.", "For two-word rhymes, think of common phrases: prime time, fender bender, brain drain.", "Check that both definitions fit their words."]}, {"n": "Alma's Shopping List", "sk": "working memory, executive function, processing speed", "how": "Each grocery item is misspelled by one letter. Fix the letter to reveal a real brand or food name. For extra challenge, try to get as many as possible in one minute.", "ex": "<b>Clue:</b> Winded &nbsp;&nbsp; <b>Answer:</b> <b>Windex</b> (D changes to X).", "st": ["Say the misspelled word aloud; it often sounds like the real one.", "Change one letter at a time, working from the vowels.", "Think of brands: Snickers, Pampers, Skippy, Jell-O.", "Some items have more than one answer (corn or pork)."]}, {"n": "Who the What?", "sk": "long-term memory, working memory", "how": "You get the name and 'the'; supply the word that follows (Felix the Cat).", "ex": "<b>Clue:</b> Alexander the ____ &nbsp;&nbsp; <b>Answer:</b> <b>Great</b>.", "st": ["Think of cartoons, history, nicknames and nursery characters.", "Say the full phrase aloud.", "The word is often a job (Sailor, Pirate) or trait (Great, Terrible).", "Use your general memory of famous nicknames."]}, {"n": "Word Parts", "sk": "long-term memory, working memory, executive functioning", "how": "You get definitions for the two parts of a word. Put them together (men + ace = menace).", "ex": "<b>Clues:</b> Chum + highest card &nbsp;&nbsp; <b>Answer:</b> <b>pal + ace = palace</b>.", "st": ["Solve each part separately and write it down.", "Join the parts in order; try both orders if needed.", "Watch for opposites (opposite of on = off).", "Check that the joined word is real."]}, {"n": "Replace the Swamp / Chartreuse Titles", "sk": "long-term memory, executive functioning", "how": "A famous title contains a placeholder (SWAMP or CHARTREUSE). Replace it with the correct geographic feature or color.", "ex": "<b>Clue:</b> Treasure SWAMP &nbsp;&nbsp; <b>Answer:</b> <b>Treasure Island</b>.", "st": ["Say the title with a likely geographic word (island, lake, river) or color (pink, red).", "Think of the author or film the title belongs to.", "Check the rhythm: titles are fixed in wording.", "Some answers have alternatives (Blue Christmas)."]}, {"n": "What's the Missing Number?", "sk": "long-term memory, executive functioning", "how": "Fill in the number from a title, saying or fact.", "ex": "<b>Clue:</b> ____ deadly sins &nbsp;&nbsp; <b>Answer:</b> <b>7</b>.", "st": ["Recall the whole phrase, then the number.", "Use categories: films (12 Angry Men), history (13 colonies), religion (10 Commandments).", "Sing it if it is a song: 99 bottles of beer.", "Check unusual numbers by counting (50 states)."]}, {"n": "What Do They Have in Common?", "sk": "long-term memory, executive functioning, attention to detail", "how": "A list of items shares something. Find the link.", "ex": "<b>Clue:</b> Jig, Twist, Tango &nbsp;&nbsp; <b>Answer:</b> <b>They are all dances</b>.", "st": ["Think of different meanings for each word (tail, pocket, crown, pin).", "Try categories: pets, dolls, fish, cars, slang for money.", "Test your link on every item.", "Names often point to people (Olivers, First Ladies' maiden names)."]}, {"n": "Finish the Food Idiom / Don't Be an Idiom", "sk": "long-term memory, executive functioning", "how": "Complete the idiom with a food (Finish the Food Idiom) or finish a sentence with an idiom starting with 'on' (Don't Be an Idiom).", "ex": "<b>Clue:</b> Spill the ____ &nbsp;&nbsp; <b>Answer:</b> <b>beans</b>.", "st": ["Say the idiom aloud; the food usually pops up.", "Read the situation carefully: 'on the wagon' means not drinking.", "Check the meaning, not just the sound.", "Some idioms accept more than one answer (on the blink or on the fritz)."]}, {"n": "Anagrams", "sk": "executive functioning", "how": "Rearrange the letters of the word to make the stated number of other words.", "ex": "<b>Clue:</b> Evil (3) &nbsp;&nbsp; <b>Answers:</b> live, veil, vile.", "st": ["Try starting with different first letters.", "Look for common endings (-s, -ed, -er) and clusters (ST, TH).", "Write the letters in a circle.", "Count the words you find against the number given."]}, {"n": "What a Pair (Redefine)", "sk": "long-term memory, working memory, executive functioning", "how": "Each clue redefines the two halves of a familiar pair. Work out the pair.", "ex": "<b>Clue:</b> Wonder and Perrier &nbsp;&nbsp; <b>Answer:</b> <b>Bread and Water</b>.", "st": ["Identify what each half is (steak or chicken = meat).", "Say the likely pair: Meat and Potatoes.", "Think of famous pairings: Fish and Chips, Bed and Breakfast.", "Check that both clues fit."]}, {"n": "Palindromes", "sk": "long-term memory, working memory, executive functioning", "how": "Each answer is a word that reads the same backward and forward.", "ex": "<b>Clue:</b> Adam's gal &nbsp;&nbsp; <b>Answer:</b> <b>Eve</b>.", "st": ["Think of short words with symmetrical letters (bib, pup, nun, dud).", "Test by writing the word backward.", "Common palindromes: madam, kayak, level, radar.", "Clues often describe a simple object or name."]}],[{"n": "How to approach any task", "sk": "long-term memory, working memory, executive functioning", "how": "Every game in this chapter trains memory and thinking. Read the one-line rule first (the starting letters, the pairing, the blank pattern) and apply it to every item.", "ex": "<b>Example:</b> In “It’s a Kick”, the rule is that every answer starts with K. The clue “A smack or a peck” becomes <b>Kiss</b>.", "st": ["Read the rule before the clues, then restate it in your own words.", "Do the easy items first; their letters and patterns often unlock harder ones.", "Say candidates aloud (sound helps with homonyms, letter spellers and compound words).", "Check each answer against every part of the clue, then spelling.", "Keep a “parking lot” of hard clues and return to them."]}, {"n": "Skills trained", "sk": "", "how": "The chapter lists the skills each game exercises.", "ex": "<b>Long-term memory:</b> facts you already know (capitals, proverbs). <b>Working memory:</b> holding letters and clues in mind while you search. <b>Executive functioning:</b> planning, flexible thinking and checking. <b>Attention to detail</b> and <b>multitasking</b> appear in a few games.", "st": ["Long-term memory: recall facts by category (food, geography, history).", "Working memory: write letters down or say them aloud.", "Executive functioning: switch strategies when one fails."]}, {"n": "It’s a Kick", "sk": "long-term memory, working memory", "how": "All of the answers in this quiz begin with the letter K.", "ex": "<b>Clue:</b> To abduct a person for ransom. [starts with K] &nbsp;&nbsp; <b>Answer:</b> <b>Kidnap</b>. <i>Kidnap: to take a person by force, usually for ransom (money demanded for release).</i>", "st": ["Read the rule first: every answer starts with K, so say the clue’s meaning and add K sounds (ki-, ka-, ke-).", "Many K words are foreign loanwords (kielbasa, kosher, klutz, kamikaze), so think about cuisine and language.", "Skip hard ones and return; later answers can unlock letters."]}, {"n": "Homonyms", "sk": "long-term memory, working memory", "how": "Homonyms are two or more words that are pronounced the same way but have different meanings and/or spellings. In this game, we supply the definitions, and you must not only provide the homonyms, but SPELL them correctly as well!", "ex": "<b>Clue:</b> Consumed; or, seven plus one. [give both words] &nbsp;&nbsp; <b>Answer:</b> <b>Ate / eight</b>. <i>Homonyms: ate = consumed; eight = seven plus one. Homonyms sound the same but have different spellings or meanings.</i>", "st": ["Split the clue at “; or,” and solve each half as a separate word.", "Say both candidates aloud; the answer pair must sound identical.", "Check the spelling of each word against its meaning (e.g. “our/flour”)."]}, {"n": "Hidden Animals", "sk": "long-term memory, working memory, executive functioning", "how": "Can you identify the animals that complete the words in this list? For example, the animal that completes “s_ _ _ ter” is cat (scatter). For a more strenuous brain exercise, try covering up the definitions and solving the incomplete word without any hints. A single wheeled cart for", "ex": "<b>Clue:</b> Wh _ _ _ barrow — A single wheeled cart for moving loads. &nbsp;&nbsp; <b>Answer:</b> <b>Wheelbarrow</b>. <i>Hidden word: EEL in Wh[EEL]barrow.</i>", "st": ["Count the blanks: each blank is a letter of the hidden animal.", "Try the first and last blank letter against short animal names (cat, ape, owl, bee).", "Use the definition to guess the whole word, then check which letters are missing."]}, {"n": "Presidential Nicknames", "sk": "long-term memory, executive functioning", "how": "Can you identify these U.S. presidents by their nicknames?", "ex": "<b>Clue:</b> Which U.S. president is nicknamed “Bubba”? &nbsp;&nbsp; <b>Answer:</b> <b>Bill Clinton</b>. <i>“Bubba”: a Southern nickname for Clinton, who was from Arkansas.</i>", "st": ["Link each nickname to a trait or era (Ike = World War II general, Silent Cal = few words).", "Short forms are often a first name or initial (Dubya = W.).", "Work out the era from slogans such as “I Like Ike”."]}, {"n": "Daily Double", "sk": "long-term memory, working memory", "how": "All of the two-word answers in this game begin with the initials D and D.", "ex": "<b>Clue:</b> Father who doesn’t pay his court-ordered child support. [initials D. D.] &nbsp;&nbsp; <b>Answer:</b> <b>Deadbeat Dad</b>. <i>Deadbeat: someone who avoids paying what they owe. Child support: court-ordered money for a child’s upkeep.</i>", "st": ["Both words start with D, so list D words for each half of the definition.", "Test the likely first word, then the second must fit the same clue.", "Names (Danny DeVito, Doris Day) are easy once the initials are known."]}, {"n": "Endings & Beginnings", "sk": "long-term memory, working memory, executive functioning", "how": "A compound word is made up of two smaller words, such as stopwatch or panhandle. In this game, we provide the first half of one compound word and the second half of another. Can you figure out the one word that completes them both? (If you get stuck, the first letter of the answer is provided in a hint.)", "ex": "<b>Clue:</b> Super ____ power [starts with M] &nbsp;&nbsp; <b>Answer:</b> <b>Man</b>. <i>Superman; manpower.</i>", "st": ["Use the hint letter and test candidates in both slots aloud (super+man, man+power).", "If you know one half of the compound, the other half is easy to test.", "Say the full compound words; a wrong answer usually sounds odd on one side."]}, {"n": "It Starts with a Letter", "sk": "long-term memory, working memory", "how": "All of the answers in this game start with a letter, as in X-Ray, I Beam, or V Chip.", "ex": "<b>Clue:</b> Discount store chain formerly known as S. S. Kresge Company. [starts with a letter, e.g. X-Ray] &nbsp;&nbsp; <b>Answer:</b> <b>Kmart</b>. <i>Kmart: a discount store chain, originally the S. S. Kresge Company.</i>", "st": ["Expect a single letter plus a word (X-ray, T-bone), often hyphenated.", "Think of brands and abbreviations (U-Haul, J. Crew, H-bomb).", "Match the clue to a famous event or product (D-Day, O-ring)."]}, {"n": "Rhymin’ Geography", "sk": "long-term memory, working memory, executive functioning", "how": "Each question has clues to two different geographical places that rhyme, such as Bali and Mali or Taos and Laos.", "ex": "<b>Clue:</b> Name the two rhyming places: U.S. state that is home to Portland and Kennebunk; and the country where you’ll find Madrid and Barcelona. [two rhyming places] &nbsp;&nbsp; <b>Answer:</b> <b>Maine and Spain</b>. <i>Maine and Spain: states/countries that rhyme; Portland and Kennebunk are in Maine.</i>", "st": ["Solve each half separately, then check that the two names rhyme.", "Go for the rhyme first: the answer ends in the same sound as the other place.", "Think of states, capitals and countries you know."]}, {"n": "Finish the Saying", "sk": "long-term memory, executive functioning", "how": "Can you finish these familiar proverbs and sayings? (The number in parentheses indicates how many words are in the correct answer.)", "ex": "<b>Clue:</b> Beauty is only ____ [2 words] &nbsp;&nbsp; <b>Answer:</b> <b>Beauty is only skin deep.</b> <i>Proverb: looks are only superficial; character matters more.</i>", "st": ["The number in brackets is the word count of the missing part.", "Say the proverb aloud and listen to the rhythm.", "If the middle is missing, guess the first word of the ending and let it unfold."]}, {"n": "Mark My Words", "sk": "long-term memory, working memory", "how": "All the answers in this word definition game begin with the letters MAR.", "ex": "<b>Clue:</b> It’s 26 miles and 385 yards long, precisely. [starts with MAR] &nbsp;&nbsp; <b>Answer:</b> <b>Marathon</b>. <i>Marathon: a 26.2-mile (26 miles 385 yards) race, named for the Greek town of Marathon.</i>", "st": ["Every answer begins with MAR: add the letters to the meaning (MAR + ble).", "Think of foods, titles and everyday things that start with MAR.", "Count syllables: MAR-a-thon, MAR-ma-lade."]}, {"n": "Letter Speller", "sk": "long-term memory", "how": "The twist in this game is that all the answers sound as if they’re just one or two letters long. For example: The plural of “is.” Answer: R (“are”). A disreputable hotel. Answer: C, D (“seedy”).", "ex": "<b>Clue:</b> Actress Ruby. [answer sounds like 1–2 letters] &nbsp;&nbsp; <b>Answer:</b> <b>D (Dee)</b>. <i>Sounds like “Dee”. </i>", "st": ["Say the answer’s meaning aloud, then split it into letter names (N-V = envy).", "Names of letters (Dee, Jay, Why, Emm, Tea) are the building blocks.", "Be flexible: Opie = O + P, excel = X + L."]}, {"n": "M & M’s", "sk": "long-term memory, working memory", "how": "All of the two-word answers in this game begin with the initials M and M.", "ex": "<b>Clue:</b> Term for a small amount of cash carried by a young woman to pay for cab fare home should her date not work out. [initials M. M.] &nbsp;&nbsp; <b>Answer:</b> <b>Mad Money</b>. <i>Mad money: spare cash a young woman keeps for a cab home if a date goes badly.</i>", "st": ["Both words start with M: brainstorm M nouns that fit each half.", "Names are often Mm: Marcel Marceau, Margaret Mitchell.", "Phrases like “Mild-Mannered” are classic double-M pairs."]}, {"n": "Geographical Double Entendres", "sk": "long-term memory, working memory, executive functioning", "how": "This is a word game combined with a trivia game in which you name the geographical place—which is also a word for something entirely different.", "ex": "<b>Clue:</b> An Asian country or . . . ceramic tableware. [a place that is also a word] &nbsp;&nbsp; <b>Answer:</b> <b>China</b>. <i>China: Asian country; china: fine ceramic tableware.</i>", "st": ["Each clue has two meanings: find the word that fits both.", "Think of places named after objects or foods (Hamburg, Orange, Canary).", "Test your candidate on both halves."]}, {"n": "X, Y, or Z", "sk": "long-term memory, working memory", "how": "All of the answers in this word definition game begin with an X, Y, or Z.", "ex": "<b>Clue:</b> Striped equine animal. [starts with X, Y or Z] &nbsp;&nbsp; <b>Answer:</b> <b>Zebra</b>. <i>Zebra: a striped, horse-like African animal.</i>", "st": ["Only three starting letters: try X-, Y- and Z- words in turn.", "X is rare (Xerox, Xylophone, Xenophobic), so start with Y and Z.", "Use the definition to pick the category (animal, music, currency)."]}, {"n": "Double Trouble", "sk": "working memory, executive functioning", "how": "Compound words are made up of two smaller words, such as hayloft or watchtower. In this game, we give the second half of some compound words. You must identify the one word that precedes each of them to make a compound word. For example, given the words weed, coast, and sick, the one word that makes each a compound word is sea (seaweed, seacoast, and seasick).", "ex": "<b>Clue:</b> ____ + hound, thirsty, stream [starts with B] &nbsp;&nbsp; <b>Answer:</b> <b>Blood</b>. <i>Bloodhound, bloodthirsty, bloodstream. Bloodhound: a tracking dog. Bloodthirsty: eager for violence.</i>", "st": ["Find one word that fits in front of all the given words.", "Use the hint letter to cut your search.", "Test the most flexible clue word first (e.g. “box” or “land”)."]}, {"n": "Add It Up", "sk": "long-term memory, executive functioning, multitasking", "how": "This game involves simple addition—but you have to figure out which numbers to add up.", "ex": "<b>Clue:</b> Add the number of dimes in a dollar to the age when a child becomes a teenager. &nbsp;&nbsp; <b>Answer:</b> <b>23</b>. <i>Working: 10 + 13 = 23.</i>", "st": ["Underline each fact (dimes in a dollar = 10) before you add.", "Decode the number clues one at a time, then do the sum.", "Check lucky/unlucky, grand slam, hat trick and similar facts first."]}, {"n": "Hidden Anatomy", "sk": "long-term memory, working memory, executive functioning", "how": "Can you identify the body parts that complete the words in this list? For example, the body part that completes “te _ _ _ raph” is leg (telegraph). For a more strenuous brain exercise, try covering up the definitions and solving the incomplete words without any hints. Notes sung together in a", "ex": "<b>Clue:</b> H _ _ _ ony — Notes sung together in a pleasing combination of sounds. &nbsp;&nbsp; <b>Answer:</b> <b>Harmony</b>. <i>Hidden word: ARM in H[ARM]ony.</i>", "st": ["Count the blanks to know the body part’s length (arm=3, chest=5).", "Test short body parts in the gap (arm, eye, toe, hip, ear, rib).", "Read the definition to confirm the whole word."]}, {"n": "Semordnilaps", "sk": "executive functioning", "how": "All the answers in this game are semordnilaps—words that spell a different word forward and backward, such as faced and decaf.", "ex": "<b>Clue:</b> Forward it’s a state of armed conflict; backward it’s uncooked. &nbsp;&nbsp; <b>Answer:</b> <b>War / Raw</b>. <i>War spelled backward is raw. </i>", "st": ["Reverse each candidate (stressed = desserts); the word that spells another word is a semordnilap.", "Work from the backward clue: “uncooked” = raw, so the forward word is war.", "The word “semordnilap” is “palindromes” spelled backward."]}, {"n": "Sheesh", "sk": "long-term memory, working memory", "how": "All of the answers in this word definition game either begin or end with the letters SH.", "ex": "<b>Clue:</b> This tool helps you put your loafers on. [contains SH at the start or end] &nbsp;&nbsp; <b>Answer:</b> <b>Shoehorn</b>. <i>Shoehorn: a curved tool that helps a heel slide into a shoe.</i>", "st": ["SH can start or end the word (shoehorn, radish, Macintosh).", "Short clues often point to everyday objects or foods.", "Use the definition first, then check where the SH sits."]}, {"n": "Replace the Elbow", "sk": "long-term memory, executive functioning", "how": "There’s something wrong with these book, story, and movie titles. Can you fix them by replacing the word ELBOW with the correct body part?", "ex": "<b>Clue:</b> Replace ELBOW: A Farewell to ELBOWS by Ernest Hemingway &nbsp;&nbsp; <b>Answer:</b> <b>A Farewell to ARMS</b>. <i>A Farewell to Arms: Hemingway’s World War I novel.</i>", "st": ["Read the title aloud with ELBOW and notice what sounds wrong.", "Think of body parts that complete a famous title (Farewell to Arms).", "Try rhymes and sounds: Goldfinger, Scarface, Tom Thumb."]}, {"n": "Kangaroo Words", "sk": "long-term memory, working memory", "how": "A Kangaroo Word is a word that contains letters of another word, in the correct order (though not necessarily contiguous), that has the same meaning. For example, the word acrid contains the word acid, and both words have similar meanings. The word expurgate contains its synonym purge. In this game, we provide the longer word. Can you find the shorter one? (Note: The longer word is called the “kangaroo,” and the shorter word is called the “joey,” which is the name for a baby kangaroo that lives in its mother’s pouch.)", "ex": "<b>Clue:</b> Find the joey hiding in “Myself”. &nbsp;&nbsp; <b>Answer:</b> <b>Me</b>. <i>“myself” contains “me” (letters in order, same meaning).</i>", "st": ["The joey is a shorter word hidden in order inside the longer word.", "Delete letters from the long word until a synonym remains.", "Check that the letters stay in order (m-y-s-e-l-f contains m-e)."]}, {"n": "What a Pair", "sk": "long-term memory, working memory, executive functioning", "how": "Harvard and Yale, Thunder and Lightning, Coke and Pepsi are all common pairs . . . but what about Wonder and Perrier? If you rede ne Wonder and Perrier correctly, you’ll come up with the more familiar pairing Bread and Water. How many familiar pairs can you make from the clues below?", "ex": "<b>Clue:</b> Enclosure for a pig . . . and the liquid released by a squid. &nbsp;&nbsp; <b>Answer:</b> <b>Pen and Ink</b>. <i>Pen and ink: writing tools; pen also means a pig enclosure, ink is squid’s defence fluid.</i>", "st": ["Solve each half of the clue, then join the two words with “and”.", "Say the pair aloud; familiar pairs sound natural.", "Keep order: the first clue word comes first."]}, {"n": "What Do They Have in Common?", "sk": "long-term memory, executive functioning, attention to detail", "how": "Each question contains a list of several items. Can you figure out what they have in common?", "ex": "<b>Clue:</b> What do these have in common? The U.S. flag, Hollywood, and the night sky &nbsp;&nbsp; <b>Answer:</b> <b>They all have stars.</b> <i>The flag, Hollywood’s Walk of Fame and the sky all have stars.</i>", "st": ["List what each item is made of or has (buttons, horns, stars).", "Look for categories: songs, beans, sugars, clubs.", "Look for something physical that all share."]}, {"n": "Red, White, or Blue", "sk": "long-term memory, working memory", "how": "All of the answers in this word definition game contain the words red, white, or blue.", "ex": "<b>Clue:</b> What British soldiers were called in colonial America. [contains red, white or blue] &nbsp;&nbsp; <b>Answer:</b> <b>Redcoats</b>. <i>Redcoats: British soldiers, named for their uniforms.</i>", "st": ["The answer always contains red, white or blue.", "Match the definition to things you know (blueprint, redwood).", "Check meaning before spelling: Redcoats are soldiers, not tires."]}, {"n": "Where’s Grandma?", "sk": "long-term memory, executive functioning", "how": "Grandma is quite the world traveler. Can you tell which U.S. states she went to last year by the places she visited?", "ex": "<b>Clue:</b> Which state? Grandma did some surfing at Big Sur, bought some sourdough bread at Fisherman’s Wharf, and saw the ancient Greek and Roman art at the Getty Museum. &nbsp;&nbsp; <b>Answer:</b> <b>California</b>. <i>Big Sur coast, Fisherman’s Wharf (San Francisco) and the Getty Museum (Los Angeles).</i>", "st": ["Find the one state that holds all of the landmarks.", "Pick the most unique landmark (Graceland, Okefenokee) to decide fast.", "Use at least two clues to be sure."]}, {"n": "Up and Down", "sk": "long-term memory, working memory", "how": "Add “up” to a word or phrase and it has one meaning. Add “down” to the same word or phrase and the meaning is entirely different.", "ex": "<b>Clue:</b> With “up” it means to make a small improvement. With “down” it’s a way to score points in football. &nbsp;&nbsp; <b>Answer:</b> <b>Touch (touch up; touchdown)</b>. <i>Touch up: improve slightly. Touchdown: a football score.</i>", "st": ["Find a word that works with both “up” and “down” but means different things.", "Try common verbs: let, turn, break, shut, back.", "Check both meanings against the clue."]}]];

e else.”", "“A small amount of caution now outweighs a large amount of repair later.”", "“Those whose own dwellings are transparent should refrain from launching pebbles.”", "“Do your harvesting of dried grass while the sun is out.”", "“A bolt from the sky never lands twice on the same spot.”", "“Solid boundaries between yards produce friendly relations with the folks next door.”", "“Talk gently, but keep a thick piece of wood at hand.”"], "ML": ["_ _ F _ _ (F, O, R, E)", "K _ _ _ _ (F, I, N, E)", "_ R U _ _ _ (F, L, A, G)", "_ _ M _ _ Y (C, O, D, E)", "S _ _ _ N _ (C, O, D, E)", "_ _ _ _ E Y (K, I, N, D)", "B _ N _ I _ _ (F, O, R, E)", "_ _ _ _ I G N (F, O, R, E)", "_ R _ _ I _ E (F, L, A, G)", "B _ _ E _ _ T (F, I, N, E)", "_ _ F T _ E _ (F, I, N, E)", "_ _ N _ _ M N (C, O, D, E)", "_ H _ W _ _ R (C, O, D, E)", "B A _ _ _ _ O T (F, O, R, E)", "_ U C _ L _ _ G (K, I, N, D)", "_ E _ P _ R O _ (F, L, A, G)", "B A _ _ _ _ B _ (O, T, H, E, R)", "_ _ U _ A T I _ N (C, O, D, E)", "_ A _ _ _ W _ R M (O, T, H, E, R)", "_ _ _ _ M _ S T A T (O, T, H, E, R)"], "KWW": ["<b>SUN</b> – Sunday, sunflower, sunset.", "<b>CAT</b> – catfish, catnip (a plant cats love), catwalk (a narrow raised path or fashion runway).", "<b>BED</b> – bedroom, bedbug, bedtime.", "<b>SEA</b> – season, seat, seal, seaweed.", "<b>PAN</b> – panther (a large black big cat), pantry (a food cupboard), pancake, panda.", "<b>ART</b> – party, artist, start, artwork.", "<b>TEA</b> – teacher, team, tear, teapot.", "<b>ACT</b> – action, cactus, factory, compact (small and tidy; also a pocket mirror case).", "<b>CAR</b> – carve (cut into slices or shapes), scarf, vicar (an Anglican parish priest), mascara (eye cosmetic).", "<b>LID</b> – valid (acceptable), collide (crash together), solid, holiday.", "<b>ICE</b> – juice, invoice (a bill listing goods or services), choice, license (an official permit).", "<b>OIL</b> – boil, spoil, toilet, turmoil (a state of great confusion).", "<b>TIC</b> – tick, stick, ticket, frantic (wildly anxious or hurried).", "<b>EAT</b> – beat, wheat, breath, creature (a living being).", "<b>SKI</b> – skip, skill, asking, pigskin (leather from a pig; also an American football).", "<b>GET</b> – budget (a spending plan), nugget (a small lump, e.g. of gold), target, vegetable.", "<b>ROB</b> – throb (to beat or pulse), probate (the legal process of proving a will), robot, acrobat (a skilled gymnast or circus performer).", "<b>THE</b> – theory (an idea that explains something), atheist (a person who does not believe in God), breathe, clothes.", "<b>LIE</b> – flies, alien (a foreigner or a creature from space), goalie (a goalkeeper), relief (comfort after worry).", "<b>VAN</b> – divan (a long, low sofa), vanity (excessive pride in one's looks), advance (to move forward), vanilla."], "KOP": ["<b>Fat / Thin</b> – size or body shape. Tip: THIN keeps the TH pair together.", "<b>Far / Near</b> – distance. A 3-letter and a 4-letter word.", "<b>Begin / End</b> – start and finish. BEGIN contains the common cluster GIN.", "<b>Love / Hate</b> – strong feelings. Both end in a vowel.", "<b>Fast / Slow</b> – speed.", "<b>Open / Close</b> – a door or a lid. Note: close is pronounced “clohz” here.", "<b>Start / Stop</b> – beginning and ending an action.", "<b>Right / Left</b> – direction. RIGHT has the cluster IGHT.", "<b>Early / Late</b> – time.", "<b>Over / Under</b> – position (above / below).", "<b>Small / Large</b> – size.", "<b>Deep / Shallow</b> – depth. SHALLOW is the longer word.", "<b>First / Last</b> – order in a sequence.", "<b>Inner / Outer</b> – position (inside / outside). Both end in -ER.", "<b>Cruel / Kind</b> – character. Split the 9 letters as 5 + 4.", "<b>Teach / Learn</b> – giving and getting knowledge. 5 + 5 letters.", "<b>Angel / Devil</b> – good and evil spirits. 5 + 5 letters.", "<b>Friend / Enemy</b> – relationships. 6 + 5 letters.", "<b>Master / Servant</b> – a person in charge and a person who serves. 6 + 7 letters.", "<b>Inside / Outside</b> – position. The 13 letters split 6 + 7; look for the shared IDE ending."], "KSW": ["<b>Better late than never.</b> Arriving late is still better than not arriving. (<i>behind schedule</i> = late; <i>preferable</i> = better.)", "<b>Actions speak louder than words.</b> What people do matters more than what they promise.", "<b>Easy come, easy go.</b> Things gained without effort are quickly lost.", "<b>The early bird catches the worm.</b> People who act first get the best result.", "<b>Honesty is the best policy.</b> Telling the truth is the wisest course.", "<b>Time flies when you're having fun.</b> Enjoyable moments pass quickly.", "<b>No man is an island.</b> People need one another (a line from the poet John Donne).", "<b>Out of sight, out of mind.</b> We forget what we cannot see.", "<b>There's no such thing as a free lunch.</b> Everything has a hidden cost.", "<b>Don't bite the hand that feeds you.</b> Do not harm someone who helps you.", "<b>Hope for the best, prepare for the worst.</b> Be optimistic but plan for problems.", "<b>You can lead a horse to water, but you can't make him drink.</b> You can offer help but not force acceptance.", "<b>If you want something done right, do it yourself.</b> It is safest to do important jobs personally.", "<b>Don't cut off your nose to spite your face.</b> Do not harm yourself to get back at someone (<i>spite</i> = a wish to hurt or annoy).", "<b>An ounce of prevention is worth a pound of cure.</b> Preventing a problem is easier than fixing it.", "<b>People who live in glass houses should not throw stones.</b> Do not criticise others for faults you have yourself.", "<b>Make hay while the sun shines.</b> Use an opportunity while conditions are good (hay is dried grass).", "<b>Lightning never strikes in the same place twice.</b> A rare misfortune is unlikely to repeat (though it can).", "<b>Good fences make good neighbors.</b> Clear boundaries keep neighbours on friendly terms.", "<b>Speak softly and carry a big stick.</b> Negotiate calmly but be ready to use strength (Theodore Roosevelt's motto)."], "KML": ["<b>offer</b> – O-F-F-E-R; blanks O, F, E, R. To propose something.", "<b>knife</b> – K-N-I-F-E; a cutting tool.", "<b>frugal</b> – F-R-U-G-A-L; careful with money.", "<b>comedy</b> – C-O-M-E-D-Y; a funny play or film.", "<b>second</b> – S-E-C-O-N-D; the one after the first.", "<b>kidney</b> – K-I-D-N-E-Y; the organ that filters blood.", "<b>bonfire</b> – B-O-N-F-I-R-E; a large outdoor fire.", "<b>foreign</b> – F-O-R-E-I-G-N; from another country.", "<b>fragile</b> – F-R-A-G-I-L-E; easily broken.", "<b>benefit</b> – B-E-N-E-F-I-T; an advantage or gain.", "<b>fifteen</b> – F-I-F-T-E-E-N; the number 15. The printed F is the second F.", "<b>condemn</b> – C-O-N-D-E-M-N; to express strong disapproval.", "<b>chowder</b> – C-H-O-W-D-E-R; a thick seafood or vegetable soup.", "<b>barefoot</b> – B-A-R-E-F-O-O-T; without shoes or socks.", "<b>duckling</b> – D-U-C-K-L-I-N-G; a young duck.", "<b>leapfrog</b> – L-E-A-P-F-R-O-G; a game of vaulting over a bent-over player.", "<b>bathrobe</b> – B-A-T-H-R-O-B-E; a robe worn after bathing.", "<b>education</b> – E-D-U-C-A-T-I-O-N; teaching and learning.", "<b>earthworm</b> – E-A-R-T-H-W-O-R-M; a worm that lives in soil.", "<b>thermostat</b> – T-H-E-R-M-O-S-T-A-T; a device that regulates temperature."]};

const app=$('app'),ov=$('overlay'),ansEl=$('answer'),awEl=$('award'),awBtns=$('awardBtns');
let teams=[{name:'',score:0},{name:'',score:0}],cur=null,round=0,done=new Set(),setIdx=0;

function nav(p){const items=[['#/','Home','home'],['#/sets','Jeopardy','play'],['#/guide/1','Guides','guide'],['#/workbook','Workbook','workbook']];
 $('nav').innerHTML=items.map(i=>`<a href="${i[0]}" class="${p===i[2]?'on':''}">${i[1]}</a>`).join('')}
function home(){
 nav('home');
 app.innerHTML=`<div class="hero"><h1>Jeopardizzy<span>!</span></h1><p>Word games for the classroom and for self-study.</p></div>
 <div class="grid" style="margin-top:18px">
 <a class="card hc" href="#/sets"><b>Jeopardy</b><small>Team quiz boards: pick a category, name the answer and win the points.</small><span class="btn p">Go to sets</span></a>
 <a class="card hc" href="#/guide/1"><b>Guides</b><small>Learn how each puzzle type works and the best ways to solve it.</small><span class="btn p">Go to guides</span></a>
