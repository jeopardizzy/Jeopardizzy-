function sets(){
 nav('play');
 app.innerHTML=`<h1>Choose a set</h1><p class="lead">Each set is a Jeopardy board with several rounds. Teams take turns picking a category and a value.</p>
 <div class="grid">${SETS.map((s,i)=>`<a class="jt" href="#/play/${i+1}"><b>Set ${i+1}</b><small>${s.data.length} categories \u00B7 ${s.data.reduce((a,c)=>a+c.items.filter(Boolean).length,0)} clues</small></a>`).join('')}</div>`}
function play(n){
 nav('play');setIdx=n-1;round=0;done=new Set();const S=SETS[setIdx];
 app.innerHTML=`<h1>Jeopardizzy! \u00B7 Set ${n}</h1><div class="row" style="margin:8px 0"><a class="btn" href="#/sets">All sets</a> <a class="btn" href="#/guide/${n}">Strategy guide</a> ${n>1?`<a class="btn" href="#/play/${n-1}">Previous set</a>`:''} ${n<SETS.length?`<a class="btn" href="#/play/${n+1}">Next set</a>`:''}</div>
 <div class="rounds" id="rounds"></div><div class="board" id="board"></div>
 <div class="scores"><div id="teams" style="display:contents"></div><div class="tools"><button id="addTeam">Add team</button><button id="reset">Reset board</button></div></div>`;
 $('addTeam').onclick=()=>{if(teams.length<5){teams.push({name:'',score:0});renderTeams()}};
 $('reset').onclick=()=>{done=new Set();teams.forEach(t=>t.score=0);buildBoard();renderTeams()};
 buildRounds();buildBoard();renderTeams()}
function buildRounds(){const R=SETS[setIdx].rounds,r=$('rounds');r.innerHTML='';
 R.forEach((_,i)=>{const b=document.createElement('button');const lf=SETS[setIdx].leftFrom;b.textContent=(lf!==undefined&&i>=lf)?'Bonus '+(i-lf+1):'Round '+(i+1);b.className=i===round?'on':'';b.onclick=()=>{round=i;buildRounds();buildBoard()};r.appendChild(b)})}
function buildBoard(){const S=SETS[setIdx],board=$('board');board.innerHTML='';const [s,e]=S.rounds[round];
 board.style.gridTemplateColumns=`repeat(${e-s},1fr)`;
 for(let c=s;c<e;c++){const h=document.createElement('div');h.className='cat';h.textContent=S.data[c].name;board.appendChild(h)}
 VALUES.forEach((v,r)=>{for(let c=s;c<e;c++){const k=document.createElement('div'),key=setIdx+'-'+c+'-'+r;
  k.className='cell'+(done.has(key)||!S.data[c].items[r]?' done':'');k.tabIndex=0;k.textContent=v;
  const op=()=>{if(!k.classList.contains('done'))openClue(c,r,k,key)};
  k.addEventListener('click',op);k.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();op()}});board.appendChild(k)}})}
function openClue(c,r,cell,key){cur={c,r,cell,key};const S=SETS[setIdx],it=S.data[c].items[r];
 $('meta').textContent=S.data[c].name+' \u00B7 '+VALUES[r];$('clue').textContent=it[0];
 ansEl.innerHTML='';ansEl.append(it[1]);if(it[2]){const d=document.createElement('small');d.textContent=it[2];ansEl.appendChild(d)}
 ansEl.classList.remove('show');awEl.classList.remove('show');ov.classList.add('open');$('reveal').focus()}
$('reveal').onclick=()=>{ansEl.classList.add('show');awBtns.innerHTML='';
 teams.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t.name||('Team '+(i+1));b.onclick=()=>{teams[i].score+=VALUES[cur.r];fin()};awBtns.appendChild(b)});
 const n=document.createElement('button');n.textContent='No one';n.onclick=fin;awBtns.appendChild(n);awEl.classList.add('show')};
function fin(){done.add(cur.key);cur.cell.classList.add('done');ov.classList.remove('open');renderTeams()}
$('close').onclick=()=>ov.classList.remove('open');
ov.addEventListener('click',e=>{if(e.target===ov)ov.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')ov.classList.remove('open')});
function renderTeams(){const t=$('teams');if(!t)return;t.innerHTML='';
 teams.forEach((tm,i)=>{const b=document.createElement('div');b.className='team';
  const inp=document.createElement('input');inp.value=tm.name;inp.placeholder='Team '+(i+1);inp.oninput=()=>{teams[i].name=inp.value};
  const sc=document.createElement('div');sc.className='score';sc.textContent=tm.score;
  const adj=document.createElement('div');adj.className='adj';
  const m=document.createElement('button');m.textContent='\u2212100';m.onclick=()=>{teams[i].score-=100;renderTeams()};
  const p=document.createElement('button');p.textContent='+100';p.onclick=()=>{teams[i].score+=100;renderTeams()};
  adj.append(m,p);b.append(inp,sc,adj);t.appendChild(b)})}
function guide(n){nav('guide');const G=GUIDES[n-1];
 app.innerHTML=`<h1>Strategy guide \u00B7 ${n==1?'All puzzle types':'Set '+n}</h1><div class="row" style="margin:8px 0">${GUIDES.map((_,i)=>`<a class="btn ${i+1==n?'p':''}" href="#/guide/${i+1}">Guide ${i+1}</a>`).join('')}</div>
 <p class="lead">${n==1?'Instructions, worked examples and strategies for the puzzle types in Set 1.':'Instructions, worked examples and strategies for the puzzle types that are new in Set '+n+'. Types that repeat work as explained in the earlier guides.'}</p>`+
 G.map(c=>`<div class="gc"><h3>${c.n}</h3><div class="b">${c.sk?`<div class="sk">Skills trained: ${c.sk}</div>`:''}<h4>Instructions</h4><p>${c.how}</p><h4>Worked example</h4><div class="ex">${c.ex}</div><h4>Strategies</h4><ul>${c.st.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`).join('')}
const WBT=[
 {id:'WW',name:"What's the Word?",q:'WW',k:'KWW',instr:'Find the 3-letter word that fits every blank in the row.',ans:['SUN','CAT','BED','SEA','PAN','ART','TEA','ACT','CAR','LID','ICE','OIL','TIC','EAT','SKI','GET','ROB','THE','LIE','VAN'],ph:'3-letter word'},
 {id:'OP',name:'Opposites Attract',q:'OP',k:'KOP',instr:'Unscramble the letters to reveal a pair of opposites. In the hardest tasks the letters of both words are mixed together (lengths in brackets).',ans:[['fat','thin'],['far','near'],['begin','end'],['love','hate'],['fast','slow'],['open','close'],['start','stop'],['right','left'],['early','late'],['over','under'],['small','large'],['deep','shallow'],['first','last'],['inner','outer'],['cruel','kind'],['teach','learn'],['angel','devil'],['friend','enemy'],['master','servant'],['inside','outside']],ph:'word / word'},
 {id:'SW',name:'Say What?',q:'SW',k:'KSW',instr:'Turn the sentence back into the well-known saying.',ans:['Better late than never','Actions speak louder than words','Easy come, easy go','The early bird catches the worm','Honesty is the best policy',"Time flies when you're having fun",'No man is an island','Out of sight, out of mind',"There's no such thing as a free lunch","Don't bite the hand that feeds you",'Hope for the best, prepare for the worst',"You can lead a horse to water, but you can't make him drink",'If you want something done right, do it yourself',"Don't cut off your nose to spite your face",'An ounce of prevention is worth a pound of cure','People who live in glass houses should not throw stones','Make hay while the sun shines','Lightning never strikes in the same place twice','Good fences make good neighbors','Speak softly and carry a big stick'],ph:'type the saying'},
 {id:'ML',name:'Missing-Letter Words',q:'ML',k:'KML',instr:'Fill the blanks with the letters in brackets, each used once, to make a common word.',ans:['offer','knife','frugal','comedy','second','kidney','bonfire','foreign','fragile','benefit','fifteen','condemn','chowder','barefoot','duckling','leapfrog','bathrobe','education','earthworm','thermostat'],ph:'the word'}];
const LVN=['Easy','Medium','Hard'];
const lvOf=i=>i<7?0:i<14?1:2;
let wb={topics:new Set(WBT.map(t=>t.id)),level:'Mixed',n:10},ses=null;
function norm(s){return String(s).toLowerCase().replace(/[\u2019']/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
function pool(){const r=[];WBT.filter(t=>wb.topics.has(t.id)).forEach(t=>t.ans.forEach((a,i)=>{if(wb.level==='Mixed'||LVN[lvOf(i)]===wb.level)r.push({t,i,a,q:WBK[t.q][i],exp:WBK[t.k][i],lv:lvOf(i)})}));return r}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function isOk(it,val){const v=norm(val);if(!v)return false;
 if(it.t.id==='WW'||it.t.id==='ML')return v===norm(it.a);
 if(it.t.id==='OP'){const w=v.split(' '),a=it.a.map(norm);return w.length===2&&((w[0]===a[0]&&w[1]===a[1])||(w[0]===a[1]&&w[1]===a[0]))}
 const aw=norm(it.a).split(' '),uw=v.split(' ');return aw.filter(x=>uw.includes(x)).length/aw.length>=0.8&&uw.length<=aw.length*1.4}
function ansText(it){return it.t.id==='OP'?it.a.join(' / '):it.t.id==='WW'?it.a:it.a}
function hintOf(it){const a=it.a;if(it.t.id==='WW')return 'Starts with '+a[0]+'.';if(it.t.id==='ML')return 'Starts with \u201C'+a[0].toUpperCase()+'\u201D and has '+a.length+' letters.';if(it.t.id==='OP')return 'Starts with \u201C'+a[0][0].toUpperCase()+'\u201D and \u201C'+a[1][0].toUpperCase()+'\u201D.';return 'Starts with: \u201C'+a.split(' ').slice(0,2).join(' ')+' \u2026\u201D'}
function workbook(){nav('workbook');ses=null;setup()}
function setup(){
 app.innerHTML=`<h1>Workbook</h1><p class="lead">Choose what you want to practise, then start. Each task checks your answer and explains it.</p>
 <div class="panel"><h2 style="margin-top:0">Topics</h2><div class="chips" id="ch">${WBT.map(t=>`<button data-t="${t.id}" class="${wb.topics.has(t.id)?'on':''}">${t.name}</button>`).join('')}</div>
 <h2>Level</h2><div class="seg" id="lv">${['Easy','Medium','Hard','Mixed'].map(l=>`<button data-l="${l}" class="${wb.level===l?'on':''}">${l}</button>`).join('')}</div>
 <h2>Number of tasks</h2><div class="seg" id="nn">${[5,10,15].map(n=>`<button data-n="${n}" class="${wb.n===n?'on':''}">${n}</button>`).join('')}</div>
 <p class="lead" id="av" style="margin:16px 0 12px"></p><button class="btn p big" id="go">Start practising</button></div>`;
 const upd=()=>{const p=pool().length;$('av').textContent=p?`${Math.min(p,wb.n)} tasks will be used (${p} match your choice).`:'No tasks match. Choose at least one topic.';$('go').disabled=!p};
 $('ch').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.t;if(wb.topics.has(id)){if(wb.topics.size>1)wb.topics.delete(id)}else wb.topics.add(id);b.classList.toggle('on',wb.topics.has(id));setup2(upd)};
 $('lv').onclick=e=>{const b=e.target.closest('button');if(!b)return;wb.level=b.dataset.l;[...$('lv').children].forEach(x=>x.classList.toggle('on',x===b));upd()};
 $('nn').onclick=e=>{const b=e.target.closest('button');if(!b)return;wb.n=+b.dataset.n;[...$('nn').children].forEach(x=>x.classList.toggle('on',x===b));upd()};
 $('go').onclick=()=>{let p=shuffle(pool()).slice(0,wb.n);if(wb.level==='Mixed')p.sort((a,b)=>a.lv-b.lv);ses={p,i:0,ok:0,res:[]};task()};
 upd()}
function setup2(f){[...$('ch').children].forEach(b=>b.classList.toggle('on',wb.topics.has(b.dataset.t)));f()}
function task(){
 const it=ses.p[ses.i],t=it.t;let hinted=false,answered=false;
 app.innerHTML=`<div class="wb"><div class="tag">Task ${ses.i+1} of ${ses.p.length} \u00B7 ${t.name} \u00B7 ${LVN[it.lv]}</div><div class="prog"><i style="width:${ses.i/ses.p.length*100}%"></i></div>
 <p class="lead" style="margin-bottom:4px">${t.instr}</p><div class="q">${it.q}</div>
 <input class="ans-in" id="in" placeholder="${t.ph}" autocomplete="off" autocapitalize="off" spellcheck="false">
 <div class="row" style="margin-top:12px"><button class="btn p" id="chk">Check</button><button class="btn" id="hint">Hint</button><button class="btn" id="show">Show answer</button></div>
 <div class="fb" id="fb"></div><div class="row" style="margin-top:14px"><button class="btn p" id="next" style="display:none">${ses.i+1<ses.p.length?'Next task':'See results'}</button></div></div>`;
 const fb=$('fb'),inp=$('in');inp.focus();
 const end=ok=>{if(answered)return;answered=true;ses.res.push({it,ok});if(ok)ses.ok++;inp.disabled=true;$('chk').style.display=$('hint').style.display=$('show').style.display='none';$('next').style.display='';
  fb.className='fb show '+(ok?'ok':'no');fb.innerHTML=`<b>${ok?'Correct!':'Not quite.'}</b> Answer: <b>${ansText(it)}</b><div style="margin-top:6px">${it.exp}</div>`;$('next').focus()};
 $('chk').onclick=()=>{if(!inp.value.trim()){inp.focus();return}if(isOk(it,inp.value))end(true);else{fb.className='fb show no';fb.innerHTML='Not quite. Try again, use a hint, or show the answer.';inp.select()}};
 $('hint').onclick=()=>{fb.className='fb show no';fb.textContent=hintOf(it);hinted=true};
 $('show').onclick=()=>end(false);
 inp.onkeydown=e=>{if(e.key==='Enter'){if(answered)$('next').click();else $('chk').click()}};
 $('next').onclick=()=>{ses.i++;ses.i<ses.p.length?task():results()}}
function results(){
 const n=ses.p.length,by={};ses.res.forEach(r=>{const k=r.it.t.name;by[k]=by[k]||[0,0];by[k][1]++;if(r.ok)by[k][0]++});
 const miss=ses.res.filter(r=>!r.ok);
 app.innerHTML=`<div class="wb"><h1>Well done!</h1><div class="score">${ses.ok} / ${n}</div>
 <p class="lead">${ses.ok===n?'A perfect score!':ses.ok>=n*0.7?'Great work. Try a harder level next.':'Good effort. Keep practising and check the guides for strategies.'}</p>
 <ul style="margin:0 0 16px 20px">${Object.entries(by).map(([k,v])=>`<li>${k}: ${v[0]} / ${v[1]}</li>`).join('')}</ul>
 ${miss.length?`<h2>Review the ones you missed</h2><ul style="margin-left:20px">${miss.map(r=>`<li style="margin:6px 0">${r.it.q}<br><b>${ansText(r.it)}</b></li>`).join('')}</ul>`:''}
 <div class="row" style="margin-top:18px"><button class="btn p" id="again">Practise again</button><button class="btn" id="chg">Change settings</button><a class="btn" href="#/guide/1">Read the guides</a></div></div>`;
 $('again').onclick=()=>{let p=shuffle(pool()).slice(0,wb.n);if(wb.level==='Mixed')p.sort((a,b)=>a.lv-b.lv);ses={p,i:0,ok:0,res:[]};task()};
 $('chg').onclick=setup}

function route(){ov.classList.remove('open');const h=(location.hash||'#/').split('/');window.scrollTo(0,0);
 try{if(h[1]==='play'&&SETS[+h[2]-1])play(+h[2]);else if(h[1]==='guide'&&GUIDES[+h[2]-1])guide(+h[2]);else if(h[1]==='sets')sets();else if(h[1]==='workbook')workbook();else home()}catch(e){home()}}
window.addEventListener('hashchange',route);route();
</script>
