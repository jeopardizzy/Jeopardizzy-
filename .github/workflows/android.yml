name: Android build

# Builds the Capacitor Android wrapper: debug APK (installable on a device)
# and release AAB (unsigned — sign locally or add signing secrets).

on:
  push:
    branches: [main]
    paths:
      - "app/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install from lockfile
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Assemble debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Assemble release bundle (unsigned AAB)
        run: cd android && ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: quizzical-club-android
          path: |
            app/android/app/build/outputs/apk/debug/app-debug.apk
            app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
