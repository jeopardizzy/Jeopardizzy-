name: Build, test, and publish site

# This repository is served by GitHub Pages in "Deploy from a branch" mode
# (main branch, / root). This workflow rebuilds the app from app/ and commits
# the built static files to the repository root, which Pages then serves.
#
# If the Pages source is ever switched to "GitHub Actions" (repo Settings →
# Pages), replace this with a standard actions/deploy-pages workflow and stop
# committing build output.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install from lockfile
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish built site to repository root
        run: node scripts/publish.mjs

      - name: Commit and push published files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets
          if git diff --staged --quiet; then
            echo "Site output unchanged — nothing to publish."
          else
            git commit -m "Publish built site from ${{ github.sha }}"
            git push
          fi
        working-directory: ${{ github.workspace }}
