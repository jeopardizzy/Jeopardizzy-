name: Upload to Google Play (internal)

# Builds the signed release AAB and uploads it to the Play Console internal
# track. Requires the app entry to exist in Play Console (created once by
# hand — the Play API cannot create apps) and the PLAY_SERVICE_ACCOUNT_JSON
# secret (service account linked to Play Console with release permissions).
# Gated on the PLAY_UPLOAD_READY repository variable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    if: vars.PLAY_UPLOAD_READY == 'true'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install from lockfile
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode upload keystore from secrets
        run: |
          mkdir -p android/keystore-out
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore-out/upload.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Assemble signed release bundle
        run: cd android && chmod +x gradlew && ./gradlew bundleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/android/keystore-out/upload.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify AAB signature
        run: jarsigner -verify app/android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Play Console (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.quizzicalclub.app
          releaseFiles: app/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
